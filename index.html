// RIPOTI YA MWEZI
// ══════════════════════════════════════════
function RipotiMwezi({data,stoki}){
  const [month,setMonth]=useState(()=>today().slice(0,7));

  function shiftMonth(delta){
    const[y,m]=month.split("-").map(Number);
    const d=new Date(y,m-1+delta,1);
    setMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  const inMonth=r=>(r.tarehe||"").slice(0,7)===month;

  const mauzoM=useMemo(()=>(data.mauzo||[]).filter(inMonth),[data.mauzo,month]);
  const mauzoJumlaM=useMemo(()=>(data.mauzoJumla||[]).filter(inMonth),[data.mauzoJumla,month]);
  const manunuziM=useMemo(()=>(data.manunuzi||[]).filter(inMonth),[data.manunuzi,month]);
  const matumiziM=useMemo(()=>(data.matumizi||[]).filter(inMonth),[data.matumizi,month]);
  const kudaiM=useMemo(()=>(data.madeniKudai||[]).filter(inMonth),[data.madeniKudai,month]);
  const kulipaM=useMemo(()=>(data.madeniKulipa||[]).filter(inMonth),[data.madeniKulipa,month]);
  const asilimia=data.asilimiaFaida||20;

  const s=useMemo(()=>{
    const o={
      mauzoJumlaKiasi:mauzoM.reduce((a,r)=>a+(+r.jumla||0),0)+mauzoJumlaM.reduce((a,r)=>a+(+r.kiasi||0),0),
      faidaHalisi:mauzoM.reduce((a,r)=>a+(+r.faida||0),0),
      faidaKadiriwaJumla:mauzoJumlaM.reduce((a,r)=>a+(+r.kiasi||0),0)*asilimia/100,
      manunuziJumla:manunuziM.reduce((a,r)=>a+(+r.jumla||0),0),
      matumiziJumla:matumiziM.reduce((a,r)=>a+(+r.kiasi||0),0),
      kudaiMpya:kudaiM.reduce((a,r)=>a+(+r.kiasi||0),0),
      kulipaMpya:kulipaM.reduce((a,r)=>a+(+r.kiasi||0),0),
      siku:new Set([...mauzoM.map(r=>r.tarehe),...mauzoJumlaM.map(r=>r.tarehe)]).size,
    };
    o.faidaJumlaYote=o.faidaHalisi+o.faidaKadiriwaJumla;
    o.faidaBaadaYaMatumizi=o.faidaJumlaYote-o.matumiziJumla;
    return o;
  },[mauzoM,mauzoJumlaM,manunuziM,matumiziM,kudaiM,kulipaM,asilimia]);

  const byProduct=useMemo(()=>{
    const map=new Map();
    for(const r of mauzoM){
      const k=r.bidhaa;if(!k)continue;
      if(!map.has(k))map.set(k,{bidhaa:k,idadi:0,jumla:0,faida:0});
      const g=map.get(k);
      g.idadi+=+r.idadi||0;g.jumla+=+r.jumla||0;g.faida+=+r.faida||0;
    }
    return[...map.values()].sort((a,b)=>b.jumla-a.jumla).slice(0,12);
  },[mauzoM]);

  const monthLabel=useMemo(()=>{
    const[y,m]=month.split("-").map(Number);
    return new Date(y,m-1,1).toLocaleDateString("sw-TZ",{month:"long",year:"numeric"});
  },[month]);

  function exportCSV(){
    let csv=`Ripoti ya Mwezi,${monthLabel}\n\n`;
    csv+=`Jumla Mauzo,${s.mauzoJumlaKiasi}\n`;
    csv+=`Faida Halisi (Mauzo ya kipande),${s.faidaHalisi}\n`;
    csv+=`Faida Kadiriwa (Mauzo ya Jumla ${asilimia}%),${s.faidaKadiriwaJumla}\n`;
    csv+=`Jumla Faida (Halisi+Kadiriwa),${s.faidaJumlaYote}\n`;
    csv+=`Jumla Manunuzi,${s.manunuziJumla}\n`;
    csv+=`Jumla Matumizi,${s.matumiziJumla}\n`;
    csv+=`Faida Baada ya Matumizi,${s.faidaBaadaYaMatumizi}\n`;
    csv+=`Madeni Mapya ya Kudai,${s.kudaiMpya}\n`;
    csv+=`Madeni Mapya ya Kulipa,${s.kulipaMpya}\n\n`;
    csv+="Bidhaa,Idadi Iliyouzwa,Jumla Mauzo,Faida\n";
    csv+=byProduct.map(p=>`"${p.bidhaa}",${p.idadi},${p.jumla},${p.faida}`).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`ripoti-${month}.csv`;a.click();
    toast("Ripoti imepakuliwa ✓");
  }

  return h("div",{className:"anim-up"},
    h("div",{className:"section-top"},
      h("div",{className:"section-title-block"},h("h2",null,"📊 Ripoti ya Mwezi"),h("p",null,monthLabel)),
      h("div",{className:"section-actions"},
        h("button",{className:"btn btn-secondary btn-icon",onClick:()=>shiftMonth(-1),title:"Mwezi uliopita"},"◀"),
        h("input",{className:"field-input",type:"month",value:month,onChange:e=>setMonth(e.target.value),style:{width:150}}),
        h("button",{className:"btn btn-secondary btn-icon",onClick:()=>shiftMonth(1),title:"Mwezi ujao"},"▶"),
        h("button",{className:"btn btn-secondary",onClick:exportCSV},"📥 Pakua Ripoti (CSV)")
      )
    ),
    h("div",{className:"stats-grid"},
      h("div",{className:"stat-card card-green"},h("div",{className:"stat-card-icon"},"🛒"),h("div",{className:"stat-card-label"},"Jumla Mauzo"),h("div",{className:"stat-card-value"},fmt(s.mauzoJumlaKiasi)),h("div",{className:"stat-card-sub"},`Siku ${s.siku} zenye mauzo`)),
      h("div",{className:"stat-card card-amber"},h("div",{className:"stat-card-icon"},"💰"),h("div",{className:"stat-card-label"},"Jumla Faida"),h("div",{className:"stat-card-value"},fmt(s.faidaJumlaYote)),h("div",{className:"stat-card-sub"},"Halisi + Kadiriwa")),
      h("div",{className:"stat-card card-red"},h("div",{className:"stat-card-icon"},"💸"),h("div",{className:"stat-card-label"},"Jumla Matumizi"),h("div",{className:"stat-card-value"},fmt(s.matumiziJumla))),
      h("div",{className:"stat-card card-brown"},h("div",{className:"stat-card-icon"},s.faidaBaadaYaMatumizi>=0?"📋":"⚠️"),h("div",{className:"stat-card-label"},"Muhtasari: Faida Baada ya Matumizi"),h("div",{className:"stat-card-value"},fmt(s.faidaBaadaYaMatumizi))),
      h("div",{className:"stat-card card-blue"},h("div",{className:"stat-card-icon"},"📦"),h("div",{className:"stat-card-label"},"Jumla Manunuzi"),h("div",{className:"stat-card-value"},fmt(s.manunuziJumla))),
      h("div",{className:"stat-card card-indigo"},h("div",{className:"stat-card-icon"},"📤"),h("div",{className:"stat-card-label"},"Madeni Mapya ya Kudai"),h("div",{className:"stat-card-value"},fmt(s.kudaiMpya))),
      h("div",{className:"stat-card card-rose"},h("div",{className:"stat-card-icon"},"📥"),h("div",{className:"stat-card-label"},"Madeni Mapya ya Kulipa"),h("div",{className:"stat-card-value"},fmt(s.kulipaMpya)))
    ),
    h("div",{className:"table-card"},
      h("div",{style:{padding:"14px 20px",borderBottom:"1px solid var(--border)"}},
        h("div",{style:{fontSize:14,fontWeight:800}},"🏆 Bidhaa Zilizouzwa Zaidi"),
        h("div",{style:{fontSize:11.5,color:"var(--text3)",marginTop:2}},"Kutoka mauzo ya kipande — 'Mauzo ya Jumla' hayana bidhaa maalum kwa hiyo hayaonekani hapa")
      ),
      h("table",null,
        h("thead",null,h("tr",null,["Bidhaa","Idadi Iliyouzwa","Jumla Mauzo","Faida"].map(c=>h("th",{key:c},c)))),
        h("tbody",null,
          !byProduct.length&&h("tr",null,h("td",{colSpan:4,style:{padding:0}},h(Empty,{emoji:"📊",title:"Hakuna mauzo ya bidhaa mwezi huu"}))),
          ...byProduct.map(p=>h("tr",{key:p.bidhaa},
            h("td",null,h("b",null,p.bidhaa)),
            h("td",{className:"td-right"},fmtN(p.idadi)),
            h("td",{className:"td-right fw"},fmt(p.jumla)),
            h("td",{className:"td-right"},h("span",{style:{color:p.faida>=0?"var(--brand)":"var(--red-500)"}},fmt(p.faida)))
          ))
        ),
        byProduct.length>0&&h("tfoot",null,h("tr",null,
          h("td",null,"Jumla"),
          h("td",{className:"td-right"},fmtN(byProduct.reduce((a,p)=>a+p.idadi,0))),
          h("td",{className:"td-right"},fmt(byProduct.reduce((a,p)=>a+p.jumla,0))),
          h("td",{className:"td-right"},fmt(byProduct.reduce((a,p)=>a+p.faida,0)))
        ))
      )
    )
  );
}

// ══════════════════════════════════════════
// KUMBUSHO YA MADENI (Weekly reminder helper)
// ══════════════════════════════════════════
function daysSince(dateStr){
  if(!dateStr)return Infinity;
  const ms=new Date(today()).getTime()-new Date(dateStr).getTime();
  return Math.floor(ms/(1000*60*60*24));
}
function KumbushoMadeni({data,patchData}){
  const PAID="Amelipa";
  const kumbushoLog=data.kumbushoLog||{};

  const byPerson=useMemo(()=>{
    const all=data.madeniKudai||[];
    const map=new Map();
    for(const r of all){
      const key=(r.jina||"").trim().toLowerCase();
      if(!key)continue;
      if(!map.has(key))map.set(key,{jina:r.jina.trim(),deni:0,simu:""});
      const g=map.get(key);
      if(r.status!==PAID)g.deni+=(+r.kiasi||0);
      if(r.simu)g.simu=r.simu;
    }
    return[...map.values()]
      .filter(p=>p.deni>0)
      .map(p=>{
        const key=p.jina.toLowerCase();
        const lastReminder=kumbushoLog[key];
        return{...p,lastReminder,siku:daysSince(lastReminder)};
      })
      .sort((a,b)=>b.siku-a.siku||b.deni-a.deni);
  },[data.madeniKudai,kumbushoLog]);

  const wanaohitajiKumbusho=byPerson.filter(p=>p.siku>=7);

  function remind(p){
    sendSMS(p.simu,`Habari ${p.jina}, unakumbushwa kuwa una deni la ${fmt(p.deni)} ambalo bado halijalipwa. Tafadhali lipa mapema iwezekanavyo. Asante.`);
    const key=p.jina.toLowerCase();
    patchData(d=>({...d,kumbushoLog:{...(d.kumbushoLog||{}),[key]:today()}}));
    toast(`Kumbusho kimetumwa kwa ${p.jina} ✓`);
  }

  return h("div",{className:"anim-up"},
    h("div",{className:"section-top"},
      h("div",{className:"section-title-block"},h("h2",null,"🔔 Kumbusho ya Madeni"),h("p",null,`${wanaohitajiKumbusho.length} wanahitaji kukumbushwa (zaidi ya siku 7 tangu kumbusho la mwisho)`))
    ),
    !byPerson.length&&h(Empty,{emoji:"🎉",title:"Hakuna anayedaiwa kwa sasa",sub:"Wateja wote wamelipa madeni yao"}),
    h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
      ...byPerson.map(p=>h("div",{
        key:p.jina,
        className:"m-card",
        style:{borderColor:p.siku>=7?"var(--amber-500)":"var(--border)"}
      },
        h("div",{className:"m-card-head"},
          h("div",null,
            h("div",{className:"m-card-title"},p.jina),
            h("div",{className:"m-card-sub"},
              p.lastReminder?`Alikumbushwa siku ${p.siku} zilizopita (${p.lastReminder})`:"Hajawahi kukumbushwa"
            )
          ),
          h(Badge,{color:p.siku>=7?"amber":"gray"},p.siku>=7?"Anahitaji kumbusho":"Amekumbushwa hivi karibuni")
        ),
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}},
          h("div",{style:{fontWeight:800,fontSize:15,color:"var(--red-500)"}},fmt(p.deni)),
          p.simu
            ?h("button",{className:"btn btn-primary btn-sm",onClick:()=>remind(p)},"📩 Tuma Kumbusho")
            :h("span",{className:"td-muted",style:{fontSize:11.5}},"Hana namba ya simu")
        )
      ))
    )
  );
}

// ══════════════════════════════════════════
// NAV CONFIG
// ══════════════════════════════════════════
const NAV=[
  {id:"home",icon:"🏠",label:"Muhtasari"},
  {id:"mauzo",icon:"🛒",label:"Mauzo"},
  {id:"jumla",icon:"🧮",label:"Mauzo Jumla"},
  {id:"manunuzi",icon:"📦",label:"Manunuzi"},
  {id:"matumizi",icon:"💸",label:"Matumizi"},
  {id:"stoki",icon:"🗄️",label:"Stoki"},
  {id:"kudai",icon:"📤",label:"Kudai"},
  {id:"kulipa",icon:"📥",label:"Kulipa"},
  {id:"ripoti",icon:"📊",label:"Ripoti ya Mwezi"},
  {id:"kumbusho",icon:"🔔",label:"Kumbusho Madeni"},
  {id:"watumiaji",icon:"👥",label:"Watumiaji",admin:true},
];
const PAGE_TITLES={home:"Muhtasari",mauzo:"Mauzo",jumla:"Mauzo ya Jumla",manunuzi:"Manunuzi",matumizi:"Matumizi ya Kila Siku",stoki:"Stoki na Bidhaa",kudai:"Madeni ya Kudai",kulipa:"Madeni ya Kulipa",ripoti:"Ripoti ya Mwezi",kumbusho:"Kumbusho ya Madeni",watumiaji:"Usimamizi wa Watumiaji",profile:"Akaunti Yangu"};

// ══════════════════════════════════════════
// ROOT APP
// ══════════════════════════════════════════
function App(){
  const [session,setSession]=useState(undefined); // undefined=inapakia, null=hajaingia
  const [localUser,setLocalUser]=useState(()=>LS.get("duka_local_user"));
  const [user,setUser]=useState(()=>LS.get("duka_local_user")); // {id,jina,role,email}
  const [page,setPage]=useState("home");
  const [dark,setDark]=useState(false);
  const [online,setOnline]=useState(navigator.onLine);
  const [sbOpen,setSbOpen]=useState(false);

  const [data,setDataRaw]=useState(()=>LS.get("duka_data")||SEED_DATA);
  const [stoki,setStokiRaw]=useState(()=>LS.get("duka_stoki")||SEED_STOKI);
  const [users,setUsersRaw]=useState([]);

  function patchData(fn){
    setDataRaw(p=>{
      const n=fn(p);
      LS.set("duka_data",n);
      try{
        sbClient.from("duka_store").upsert({key:"duka_data",value:n,updated_at:new Date().toISOString()})
          .then(({error})=>{if(error)toast("Haikusawazishwa mtandaoni (imehifadhiwa kwenye kifaa)","warning")})
          .catch(()=>{});
      }catch(e){}
      return n;
    });
  }
  function patchStoki(fn){
    setStokiRaw(p=>{
      const n=typeof fn==="function"?fn(p):fn;
      LS.set("duka_stoki",n);
      try{
        sbClient.from("duka_store").upsert({key:"duka_stoki",value:n,updated_at:new Date().toISOString()})
          .then(({error})=>{if(error)toast("Haikusawazishwa mtandaoni (imehifadhiwa kwenye kifaa)","warning")})
          .catch(()=>{});
      }catch(e){}
      return n;
    });
  }
  async function setUserRole(id,role){
    try{
      const{error}=await sbClient.from("profiles").update({role}).eq("id",id);
      if(error)toast("Imeshindwa kubadilisha nafasi","error");else toast("Nafasi imesasishwa ✓");
    }catch(e){
      toast("Imeshindwa kubadilisha nafasi","error");
    }
  }

  // Auth: pata session iliyopo, na sikiliza mabadiliko (login/logout)
  useEffect(()=>{
    let done=false;
    const timeout=setTimeout(()=>{
      if(!done){
        done=true;
        setSession(s=>s===undefined?null:s);
      }
    },1500);

    try{
      sbClient.auth.getSession()
        .then(({data:{session}})=>{
          if(!done){
            done=true;
            clearTimeout(timeout);
            setSession(session||null);
          }
        })
        .catch(()=>{
          if(!done){
            done=true;
            clearTimeout(timeout);
            setSession(null);
          }
        });

      const{data:sub}=sbClient.auth.onAuthStateChange((_e,s)=>{
        setSession(s||null);
      });
      return()=>{
        clearTimeout(timeout);
        if(sub&&sub.subscription)sub.subscription.unsubscribe();
      };
    }catch(e){
      clearTimeout(timeout);
      setSession(null);
    }
  },[]);

  // Pakua wasifu (jina/role) mtumiaji akishaingia
  useEffect(()=>{
    if(localUser){
      setUser(localUser);
      return;
    }
    if(!session){
      setUser(null);
      return;
    }
    let active=true;
    (async()=>{
      try{
        const{data:prof}=await sbClient.from("profiles").select("id,jina,role").eq("id",session.user.id).single();
        if(!active)return;
        if(prof)setUser({id:prof.id,jina:prof.jina,role:prof.role,email:session.user.email});
        else setUser({id:session.user.id,jina:session.user.email,role:"karani",email:session.user.email});
      }catch(e){
        if(!active)return;
        setUser({id:session.user.id,jina:session.user.email,role:"karani",email:session.user.email});
      }
    })();
    return()=>{active=false};
  },[session,localUser]);

  // Pakua data + jisajili kwa "real-time" mabadiliko baada ya kuingia
  useEffect(()=>{
    if(!user)return;
    const localD=LS.get("duka_data")||SEED_DATA;
    const localS=LS.get("duka_stoki")||SEED_STOKI;
    setDataRaw(localD);
    setStokiRaw(localS);

    let active=true;
    (async()=>{
      try{
        const{data:rows}=await sbClient.from("duka_store").select("key,value").in("key",["duka_data","duka_stoki"]);
        const remoteData=rows&&rows.find(r=>r.key==="duka_data");
        const remoteStoki=rows&&rows.find(r=>r.key==="duka_stoki");
        if(!active)return;
        if(remoteData){setDataRaw(remoteData.value);LS.set("duka_data",remoteData.value)}
        if(remoteStoki){setStokiRaw(remoteStoki.value);LS.set("duka_stoki",remoteStoki.value)}
        if(!remoteData)sbClient.from("duka_store").upsert({key:"duka_data",value:localD,updated_at:new Date().toISOString()}).catch(()=>{});
        if(!remoteStoki)sbClient.from("duka_store").upsert({key:"duka_stoki",value:localS,updated_at:new Date().toISOString()}).catch(()=>{});
      }catch(e){}
    })();

    try{
      sbClient.from("profiles").select("id,jina,role")
        .then(({data:profs})=>{if(active&&profs)setUsersRaw(profs)})
        .catch(()=>{});

      const channel=sbClient.channel("duka_realtime")
        .on("postgres_changes",{event:"*",schema:"public",table:"duka_store"},payload=>{
          const row=payload.new;if(!row)return;
          if(row.key==="duka_data"){setDataRaw(row.value);LS.set("duka_data",row.value)}
          if(row.key==="duka_stoki"){setStokiRaw(row.value);LS.set("duka_stoki",row.value)}
        })
        .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>{
          sbClient.from("profiles").select("id,jina,role")
            .then(({data:profs})=>{if(profs)setUsersRaw(profs)})
            .catch(()=>{});
        })
        .subscribe();

      return()=>{active=false;try{sbClient.removeChannel(channel)}catch(e){}};
    }catch(e){
      return()=>{active=false};
    }
  },[user&&user.id]);

  useEffect(()=>{
    const dk=LS.get("duka_dark");if(dk)setDark(true);
  },[]);
  useEffect(()=>{document.documentElement.setAttribute("data-theme",dark?"dark":"light");LS.set("duka_dark",dark)},[dark]);
  useEffect(()=>{
    const on=()=>setOnline(true);const off=()=>setOnline(false);
    window.addEventListener("online",on);window.addEventListener("offline",off);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off)};
  },[]);

  if(session===undefined&&!localUser)return h("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,background:"var(--bg)"}},
    h("div",{style:{fontSize:52}},"🏪"),
    h("div",{style:{color:"var(--brand)",fontWeight:700,fontSize:16,letterSpacing:".02em"}},"Inapakia Mfumo...")
  );

  if(!user)return h(Fragment,null,h(ToastProvider),h(Login,{onLogin:u=>{setLocalUser(u);setUser(u);}}));

  if(!data||!stoki)return h(Fragment,null,h(ToastProvider),h("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,background:"var(--bg)"}},
    h("div",{style:{fontSize:52}},"🏪"),
    h("div",{style:{color:"var(--brand)",fontWeight:700,fontSize:16,letterSpacing:".02em"}},"Inapakia Data...")
  ));

  const isAdmin=user.role==="admin";
  const visibleNav=NAV.filter(n=>!n.admin||isAdmin);
  const mobileNav=visibleNav.slice(0,5);

  // Alerts count
  const alerts=(stoki||[]).filter(s=>s.idadi<=s.min).length;

  function logout(){
    LS.set("duka_local_user",null);
    setLocalUser(null);
    setUser(null);
    try{sbClient.auth.signOut()}catch(e){}
    setPage("home");
  }
  function goPage(id){setPage(id);setSbOpen(false)}

  function renderPage(){
    const props={data,patchData,stoki,patchStoki,user};
    switch(page){
      case"home":return h(Dashboard,{data,stoki});
      case"mauzo":return h(Mauzo,props);
      case"jumla":return h(MauzoJumla,props);
      case"manunuzi":return h(Manunuzi,props);
      case"matumizi":return h(Matumizi,props);
      case"stoki":return h(Stoki,{stoki,patchStoki,user});
      case"kudai":return h(DeniPage,{type:"madeniKudai",...props});
      case"kulipa":return h(DeniPage,{type:"madeniKulipa",...props});
      case"ripoti":return h(RipotiMwezi,{data,stoki});
      case"kumbusho":return h(KumbushoMadeni,{data,patchData});
      case"watumiaji":return isAdmin?h(Watumiaji,{users,currentUser:user,setUserRole}):null;
      case"profile":return h(Profile,{user,data,stoki,patchData,patchStoki});
      default:return null;
    }
  }

  return h(Fragment,null,
    h(ToastProvider),
    !online&&h("div",{className:"offline-banner"},"📵 Hakuna mtandao — Data inahifadhiwa kwenye kifaa. Itasawazishwa ukiungana tena."),

    h("div",{className:"shell"},
      // Sidebar overlay
      h("div",{className:clsx("sb-overlay",sbOpen&&"show"),onClick:()=>setSbOpen(false)}),

      // SIDEBAR
      h("div",{className:clsx("sidebar",sbOpen&&"open")},
        h("div",{className:"sb-brand"},
          h("div",{className:"sb-brand-icon"},"🏪"),
          h("div",null,
            h("div",{className:"sb-brand-name"},"Mfumo wa Duka"),
            h("div",{className:"sb-brand-tagline"},"Usimamizi wa Biashara")
          )
        ),
        h("div",{className:"sb-user"},
          h("div",{className:"user-row"},
            h("div",{className:"sb-avatar",style:{background:isAdmin?"#9333ea":"#2563eb"}},user.jina[0].toUpperCase()),
            h("div",{style:{flex:1,minWidth:0}},
              h("div",{className:"sb-user-name"},user.jina),
              h("div",{className:"sb-user-role"},isAdmin?"👑 Meneja":"📋 Karani"),
              h("div",{className:"sb-online"},h("div",{className:"sb-online-dot"}),h("div",{className:"sb-online-text"},online?"Mtandaoni":"Nje ya mtandao"))
            )
          )
        ),
        h("div",{className:"sb-nav"},
          h("div",{className:"sb-section-label"},"Kurasa Kuu"),
          ...visibleNav.map(n=>h("button",{key:n.id,className:clsx("nav-item",page===n.id&&"active"),onClick:()=>goPage(n.id)},
            h("div",{className:"nav-icon"},n.icon),
            h("span",{className:"nav-label"},n.label),
            n.id==="stoki"&&alerts>0&&h("span",{className:"nav-badge",style:{background:"var(--amber-500)"}},alerts)
          )),
          h("div",{className:"sb-section-label",style:{marginTop:8}},"Akaunti"),
          h("button",{className:clsx("nav-item",page==="profile"&&"active"),onClick:()=>goPage("profile")},
            h("div",{className:"nav-icon"},"⚙️"),h("span",{className:"nav-label"},"Akaunti Yangu")
          )
        ),
        h("div",{className:"sb-footer"},
          h("button",{className:"sb-footer-btn",onClick:()=>setDark(v=>!v)},dark?"☀️":"🌙","  ",dark?"Muonekano wa Mchana":"Muonekano wa Usiku"),
          h("button",{className:"sb-footer-btn",onClick:()=>exportAll(data)},"📥","  Pakua Data Yote (CSV)"),
          h("button",{className:"sb-footer-btn danger",onClick:logout},"🚪","  Toka kwenye Mfumo")
        )
      ),

      // MAIN AREA
      h("div",{className:"main-area"},
        // Top bar
        h("div",{className:"topbar"},
          h("button",{className:"icon-btn hamburger",onClick:()=>setSbOpen(v=>!v),style:{display:"none"}},"☰"),
          h("div",{className:"tb-title"},
            h("h1",null,PAGE_TITLES[page]||""),
            h("p",null,new Date().toLocaleDateString("sw-TZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"}))
          ),
          h("div",{className:"tb-actions"},
            h("button",{className:"icon-btn",onClick:()=>setDark(v=>!v),title:dark?"Mwanga":"Giza"},dark?"☀️":"🌙"),
            !online&&h("span",{style:{fontSize:11,fontWeight:700,color:"var(--amber-600)",background:"var(--amber-50)",padding:"4px 9px",borderRadius:20,border:"1px solid var(--amber-200)"}},"📵 Offline")
          )
        ),

        // Page content
        h("div",{className:"page"},renderPage()),

        // Bottom nav
        h("div",{className:"bottom-nav"},
          h("div",{className:"bottom-nav-inner"},
            ...mobileNav.map(n=>h("button",{key:n.id,className:clsx("bnav",page===n.id&&"active"),onClick:()=>goPage(n.id)},
              h("div",{className:"bnav-icon"},n.icon),
              n.label,
              h("div",{className:"bnav-bar"})
            ))
          )
        )
      )
    )
  );
}

ReactDOM.render(h(App),document.getElementById("root"));
