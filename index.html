<!DOCTYPE html>
<html lang="sw" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#15803d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Duka"/>
<link rel="manifest" href="./manifest.json"/>
<title>Mfumo wa Duka</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  --green-50:#f0fdf4; --green-100:#dcfce7; --green-200:#bbf7d0;
  --green-500:#22c55e; --green-600:#16a34a; --green-700:#15803d;
  --green-800:#166534; --green-900:#14532d; --green-950:#052e16;

  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0;
  --slate-300:#cbd5e1; --slate-400:#94a3b8; --slate-500:#64748b;
  --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b;
  --slate-900:#0f172a; --slate-950:#020617;

  --amber-400:#fbbf24; --amber-500:#f59e0b; --amber-600:#d97706;
  --amber-50:#fffbeb; --amber-100:#fef3c7;

  --red-400:#f87171; --red-500:#ef4444; --red-600:#dc2626;
  --red-50:#fef2f2; --red-100:#fee2e2;

  --blue-500:#3b82f6; --blue-600:#2563eb;
  --blue-50:#eff6ff; --blue-100:#dbeafe;

  --purple-500:#a855f7; --purple-600:#9333ea;
  --purple-50:#faf5ff; --purple-100:#f3e8ff;

  /* Semantic */
  --bg:#f8fafc;
  --bg2:#f1f5f9;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --surface3:#f1f5f9;
  --border:#e2e8f0;
  --border2:#cbd5e1;
  --text:#0f172a;
  --text2:#475569;
  --text3:#64748b;
  --brand:#16a34a;
  --brand-dark:#15803d;
  --brand-deeper:#14532d;
  --brand-light:#dcfce7;
  --brand-glow:rgba(22,163,74,0.22);
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow:0 4px 6px -1px rgba(15,23,42,.07),0 2px 4px -2px rgba(15,23,42,.05);
  --shadow-md:0 10px 15px -3px rgba(15,23,42,.08),0 4px 6px -4px rgba(15,23,42,.04);
  --shadow-lg:0 20px 25px -5px rgba(15,23,42,.09),0 8px 10px -6px rgba(15,23,42,.04);
  --shadow-xl:0 25px 50px -12px rgba(15,23,42,.15);
  --r:14px; --r-sm:10px; --r-md:16px; --r-lg:20px; --r-xl:24px; --r-2xl:28px;
  --sidebar-w:260px;
  --header-h:62px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

[data-theme="dark"] {
  --bg:#090d0a; --bg2:#0f1712; --surface:#131e16; --surface2:#19271d; --surface3:#203226;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.16);
  --text:#f8fafc; --text2:#cbd5e1; --text3:#94a3b8;
  --brand:#22c55e; --brand-dark:#16a34a;
  --brand-light:rgba(34,197,94,.16);
  --brand-glow:rgba(34,197,94,.32);
  --shadow-xs:0 1px 2px rgba(0,0,0,.5);
  --shadow-sm:0 1px 3px rgba(0,0,0,.6);
  --shadow:0 4px 8px rgba(0,0,0,.55);
  --shadow-md:0 10px 18px rgba(0,0,0,.6);
  --shadow-lg:0 20px 35px rgba(0,0,0,.7);
  --shadow-xl:0 25px 50px rgba(0,0,0,.85);
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{
  -webkit-text-size-adjust:100%;
  height:100%;
  overscroll-behavior-y:none;
}
body{
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  font-feature-settings:"cv02","cv03","cv04","cv11","tnum" 1;
  background:var(--bg);color:var(--text);
  min-height:100%;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
#root{min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
img,svg{display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* ═══════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bounce-in{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}

.anim-fade{animation:fadeIn .2s cubic-bezier(.16,1,.3,1) both}
.anim-up{animation:fadeUp .28s cubic-bezier(.16,1,.3,1) both}
.anim-scale{animation:scaleIn .22s cubic-bezier(.16,1,.3,1) both}

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.shell{display:flex;height:100vh;overflow:hidden;position:relative}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--green-950);
  display:flex;flex-direction:column;
  height:100%;overflow:hidden;
  transition:transform .3s cubic-bezier(.16,1,.3,1);
  z-index:200;position:relative;
}
[data-theme="dark"] .sidebar{background:#040905;border-right:1px solid var(--border)}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:calc(var(--header-h) + var(--safe-top));
  flex-shrink:0;
  background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:var(--safe-top) 20px 0;
  gap:12px;
  position:sticky;top:0;z-index:50;
  transition:background .2s,border-color .2s;
}
[data-theme="dark"] .topbar{
  background:rgba(19,30,22,.85);
  border-bottom-color:var(--border);
}
.page{
  flex:1;overflow-y:auto;padding:26px 24px 36px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}

/* ═══════════════════════════════════════════
   SIDEBAR PARTS
═══════════════════════════════════════════ */
.sb-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-brand-icon{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,var(--green-500),var(--green-700));
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
  box-shadow:0 4px 14px rgba(22,163,74,.4),inset 0 1px 0 rgba(255,255,255,.25);
}
.sb-brand-name{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.2}
.sb-brand-tagline{font-size:11.5px;color:rgba(187,247,208,.75);font-weight:500;margin-top:2px}

.sb-user{
  margin:14px 12px 6px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--r);padding:12px 14px;
  display:flex;align-items:center;gap:12px;
}
.sb-avatar{
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#fff;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.sb-user-name{font-size:13.5px;font-weight:700;color:#fff;line-height:1.2}
.sb-user-role{font-size:11px;color:rgba(187,247,208,.85);font-weight:600;margin-top:2px}
.sb-online{display:flex;align-items:center;gap:5px;margin-top:3px}
.sb-online-dot{width:7px;height:7px;border-radius:50%;background:var(--green-400);box-shadow:0 0 8px rgba(74,222,128,.8);animation:pulse 2s infinite}
.sb-online-text{font-size:10.5px;color:rgba(255,255,255,.6);font-weight:500}

.sb-section-label{
  padding:16px 18px 6px;
  font-size:10px;font-weight:800;letter-spacing:.12em;
  color:rgba(187,247,208,.4);text-transform:uppercase;
}
.sb-nav{flex:1;overflow-y:auto;padding:0 10px;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}

.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:var(--r-sm);
  border:none;background:transparent;
  color:rgba(255,255,255,.62);font-size:13.5px;font-weight:500;
  cursor:pointer;transition:all .16s cubic-bezier(.16,1,.3,1);text-align:left;width:100%;
  margin-bottom:2px;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{
  background:linear-gradient(135deg,rgba(22,163,74,.4),rgba(22,163,74,.22));
  color:#fff;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(74,222,128,.35);
}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:20px;background:var(--green-400);border-radius:0 3px 3px 0;
  box-shadow:0 0 8px rgba(74,222,128,.6);
}
.nav-icon{
  width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
  background:rgba(255,255,255,.06);transition:all .15s;
}
.nav-item.active .nav-icon{background:rgba(34,197,94,.28);transform:scale(1.05)}
.nav-label{flex:1}
.nav-badge{
  min-width:20px;height:20px;padding:0 6px;
  border-radius:10px;font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}

.sb-footer{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.sb-footer-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--r-sm);
  border:none;background:transparent;
  color:rgba(255,255,255,.5);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .15s;width:100%;text-align:left;
  margin-bottom:2px;-webkit-tap-highlight-color:transparent;
}
.sb-footer-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-footer-btn.danger:hover{color:#fca5a5;background:rgba(239,68,68,.12)}

/* ═══════════════════════════════════════════
   TOP BAR
═══════════════════════════════════════════ */
.tb-title{flex:1}
.tb-title h1{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.02em}
.tb-title p{font-size:11.5px;color:var(--text3);margin-top:1px;font-weight:500}
.tb-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .12s cubic-bezier(.16,1,.3,1),background .15s,color .15s,border-color .15s;
  font-size:16px;flex-shrink:0;-webkit-tap-highlight-color:transparent;
  box-shadow:var(--shadow-xs);
}
.icon-btn:hover{background:var(--surface3);border-color:var(--border2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.hamburger{display:none}

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 16px;border-radius:12px;
  border:none;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:transform .12s cubic-bezier(.16,1,.3,1),background .15s,box-shadow .15s,opacity .15s;
  white-space:nowrap;line-height:1;
  -webkit-tap-highlight-color:transparent;user-select:none;
  touch-action:manipulation;
}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn-primary{
  background:linear-gradient(180deg,#16a34a 0%,#15803d 100%);
  color:#ffffff;
  box-shadow:0 3px 12px var(--brand-glow),inset 0 1px 0 rgba(255,255,255,.2);
}
.btn-primary:hover{
  background:linear-gradient(180deg,#15803d 0%,#166534 100%);
  box-shadow:0 4px 16px var(--brand-glow);
}
.btn-primary:active{
  transform:scale(.96);
  box-shadow:0 2px 6px var(--brand-glow);
}
.btn-secondary{
  background:var(--surface);color:var(--text);
  border:1px solid var(--border);box-shadow:var(--shadow-xs);
}
.btn-secondary:hover{background:var(--surface3);border-color:var(--border2)}
.btn-secondary:active{transform:scale(.96);background:var(--surface3)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid transparent}
.btn-ghost:hover{background:var(--surface3);color:var(--text)}
.btn-ghost:active{transform:scale(.94)}
.btn-danger{
  background:var(--red-50);color:var(--red-600);
  border:1px solid #fecaca;
}
.btn-danger:hover{background:var(--red-100);border-color:#fca5a5}
.btn-danger:active{transform:scale(.96)}
.btn-warning{background:var(--amber-50);color:var(--amber-600);border:1px solid #fde68a}
.btn-warning:hover{background:var(--amber-100)}
.btn-warning:active{transform:scale(.96)}
.btn-info{background:var(--blue-50);color:var(--blue-600);border:1px solid #bfdbfe}
.btn-info:hover{background:var(--blue-100)}
.btn-info:active{transform:scale(.96)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:10px;gap:5px}
.btn-lg{padding:14px 22px;font-size:15px;border-radius:14px;font-weight:700}
.btn-icon{width:36px;height:36px;padding:0;justify-content:center;font-size:15px;border-radius:11px}
[data-theme="dark"] .btn-primary{
  background:linear-gradient(180deg,#22c55e 0%,#16a34a 100%);
  color:#052e16;font-weight:700;
  box-shadow:0 3px 14px rgba(34,197,94,.35),inset 0 1px 0 rgba(255,255,255,.3);
}
[data-theme="dark"] .btn-danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.3);color:#fca5a5}
[data-theme="dark"] .btn-warning{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.3);color:#fde047}
[data-theme="dark"] .btn-info{background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.3);color:#93c5fd}

/* ═══════════════════════════════════════════
   BADGES
═══════════════════════════════════════════ */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3.5px 10px;border-radius:99px;
  font-size:11.5px;font-weight:700;line-height:1.35;
  letter-spacing:-.01em;
}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.badge-green{background:var(--green-100);color:var(--green-800);border:1px solid rgba(34,197,94,.25)}
.badge-green::before{background:var(--green-600)}
.badge-red{background:var(--red-100);color:var(--red-700);border:1px solid rgba(239,68,68,.25)}
.badge-red::before{background:var(--red-500)}
.badge-amber{background:var(--amber-100);color:var(--amber-700);border:1px solid rgba(245,158,11,.25)}
.badge-amber::before{background:var(--amber-500)}
.badge-blue{background:var(--blue-100);color:var(--blue-700);border:1px solid rgba(59,130,246,.25)}
.badge-blue::before{background:var(--blue-500)}
.badge-purple{background:var(--purple-100);color:var(--purple-700);border:1px solid rgba(168,85,247,.25)}
.badge-purple::before{background:var(--purple-500)}
.badge-gray{background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.badge-gray::before{background:var(--text3)}
[data-theme="dark"] .badge-green{background:rgba(34,197,94,.16);color:#86efac;border-color:rgba(34,197,94,.3)}
[data-theme="dark"] .badge-green::before{background:#4ade80}
[data-theme="dark"] .badge-red{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.3)}
[data-theme="dark"] .badge-red::before{background:#f87171}
[data-theme="dark"] .badge-amber{background:rgba(245,158,11,.16);color:#fde047;border-color:rgba(245,158,11,.3)}
[data-theme="dark"] .badge-amber::before{background:#fbbf24}
[data-theme="dark"] .badge-blue{background:rgba(59,130,246,.16);color:#93c5fd;border-color:rgba(59,130,246,.3)}
[data-theme="dark"] .badge-blue::before{background:#60a5fa}
[data-theme="dark"] .badge-purple{background:rgba(168,85,247,.16);color:#d8b4fe;border-color:rgba(168,85,247,.3)}
[data-theme="dark"] .badge-purple::before{background:#c084fc}
[data-theme="dark"] .badge-gray{background:rgba(255,255,255,.08);color:#cbd5e1;border-color:rgba(255,255,255,.12)}

/* ═══════════════════════════════════════════
   CATEGORY CHIPS & FACES (MODERN CATEGORY BAR)
═══════════════════════════════════════════ */
.category-face-bar{
  display:flex;align-items:center;gap:8px;
  overflow-x:auto;padding:2px 2px 14px;
  margin-bottom:18px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.category-face-bar::-webkit-scrollbar{display:none}

.category-chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:14px;
  background:var(--surface);border:1.5px solid var(--border);
  color:var(--text2);font-size:12.5px;font-weight:700;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:all .15s cubic-bezier(.16,1,.3,1);
  box-shadow:var(--shadow-xs);
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.category-chip:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}
.category-chip:active{transform:scale(.95)}
.category-chip-icon{font-size:16px;line-height:1}
.category-chip-count{
  padding:2px 7px;border-radius:99px;
  font-size:10.5px;font-weight:800;
  background:rgba(0,0,0,.06);color:inherit;
  font-variant-numeric:tabular-nums;
  transition:all .15s;
}

/* "Zote" Chip */
.category-chip.cat-chip-all{
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border-color:var(--border2);color:var(--text);
}
.category-chip.cat-chip-all.active{
  background:linear-gradient(135deg,#10b981 0%,#059669 100%);
  border-color:#059669;color:#fff;
  box-shadow:0 4px 14px rgba(16,185,129,.35);
}
.category-chip.cat-chip-all.active .category-chip-count{
  background:rgba(255,255,255,.25);color:#fff;
}
[data-theme="dark"] .category-chip.cat-chip-all{
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 100%);
  border-color:rgba(255,255,255,.15);color:#e2e8f0;
}
[data-theme="dark"] .category-chip.cat-chip-all.active{
  background:linear-gradient(135deg,#10b981 0%,#047857 100%);
  border-color:#10b981;color:#fff;
  box-shadow:0 4px 16px rgba(16,185,129,.35);
}

/* Category Badges (The modern visual 'face' of each category) */
.cat-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:10px;
  font-size:12px;font-weight:700;line-height:1.25;
  white-space:nowrap;letter-spacing:-.01em;
  border:1px solid transparent;
  transition:transform .12s,box-shadow .12s,background .12s;
  box-shadow:var(--shadow-xs);
}
.cat-badge:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.cat-badge:active{transform:scale(.96)}
.cat-badge-icon{font-size:13.5px;line-height:1}

/* ═══════════════════════════════════════════
   CATEGORY CARDS (GLASSMORPHISM & SOFT ROUNDED BORDERS)
═══════════════════════════════════════════ */
.category-card,
.m-card.cat-card{
  position:relative;
  overflow:hidden;
  border-radius:18px !important;
  background:rgba(255,255,255,.76);

.category-card::before,
.m-card.cat-card::before{

.m-card.cat-card:hover{

}
.category-card:active,
.m-card.cat-card:active{

}
[data-theme="dark"] .category-card,

/* ═══════════════════════════════════════════
   STAT CARDS
═══════════════════════════════════════════ */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px;margin-bottom:26px;
}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:18px 20px;
  box-shadow:var(--shadow-xs);
  transition:transform .18s cubic-bezier(.16,1,.3,1),box-shadow .18s,border-color .18s;
  cursor:default;position:relative;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--border2)}
.stat-card:active{transform:scale(.98)}
.stat-card-icon{
  width:42px;height:42px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;margin-bottom:12px;position:relative;z-index:1;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
}
.stat-card-label{
  font-size:11px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;
}
.stat-card-value{
  font-size:21px;font-weight:800;color:var(--text);
  letter-spacing:-.025em;line-height:1.2;
  font-variant-numeric:tabular-nums;
}
.stat-card-sub{font-size:12px;color:var(--text3);margin-top:6px;display:flex;align-items:center;gap:4px}
.stat-card-trend{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;margin-left:auto}
.trend-up{background:var(--green-100);color:var(--green-700)}
.trend-down{background:var(--red-100);color:var(--red-600)}
[data-theme="dark"] .trend-up{background:rgba(34,197,94,.12);color:#86efac}
[data-theme="dark"] .trend-down{background:rgba(239,68,68,.12);color:#fca5a5}

/* ═══════════════════════════════════════════
   SECTION HEADER
═══════════════════════════════════════════ */
.section-top{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:20px;gap:12px;flex-wrap:wrap;
}
.section-title-block h2{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.025em}
.section-title-block p{font-size:12px;color:var(--text3);margin-top:2px;font-weight:500}
.section-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ═══════════════════════════════════════════
   TABLE
═══════════════════════════════════════════ */
.table-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow-xs);
}
table{width:100%;border-collapse:collapse}
thead{background:var(--surface2)}
thead th{
  padding:11px 16px;text-align:left;
  font-size:11px;font-weight:800;color:var(--text3);
  text-transform:uppercase;letter-spacing:.08em;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
thead th:first-child{padding-left:20px}
thead th:last-child{padding-right:20px;text-align:right}
tbody tr{transition:background .14s;border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:13px 16px;font-size:13.5px;color:var(--text);vertical-align:middle}
tbody td:first-child{padding-left:20px}
tbody td:last-child{padding-right:20px;text-align:right}
tfoot td{
  padding:13px 16px;font-size:13.5px;font-weight:800;
  background:var(--surface2);border-top:2px solid var(--border);
  color:var(--text);font-variant-numeric:tabular-nums;
}
tfoot td:first-child{padding-left:20px}
tfoot td:last-child{padding-right:20px;text-align:right}
.td-right{text-align:right!important}
.td-center{text-align:center!important}
.td-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12.5px;font-variant-numeric:tabular-nums}
.td-fw{font-weight:700;font-variant-numeric:tabular-nums}
.td-muted{color:var(--text3);font-size:12.5px}

/* ═══════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════ */
.search{position:relative}
.search-input{
  width:100%;padding:10px 14px 10px 38px;
  border:1px solid var(--border);border-radius:12px;
  background:var(--surface);color:var(--text);font-size:13.5px;
  outline:none;transition:border-color .15s,box-shadow .15s,background .15s;min-width:200px;
  -webkit-tap-highlight-color:transparent;
  box-shadow:var(--shadow-xs);
}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-glow),0 1px 2px rgba(0,0,0,.05);
}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:15px}

/* ═══════════════════════════════════════════
   MOBILE CARDS
═══════════════════════════════════════════ */
.m-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:16px;
  box-shadow:var(--shadow-xs);margin-bottom:12px;
  transition:transform .14s cubic-bezier(.16,1,.3,1),box-shadow .14s,border-color .14s;
  -webkit-tap-highlight-color:transparent;
}
.m-card:active{transform:scale(.985);box-shadow:var(--shadow-xs)}
.m-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
.m-card-title{font-size:14.5px;font-weight:700;color:var(--text);line-height:1.3;letter-spacing:-.01em}
.m-card-sub{font-size:12px;color:var(--text3);margin-top:2px;font-weight:500}
.m-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.m-card-field{
  background:var(--surface2);border-radius:12px;
  padding:10px 12px;border:1px solid var(--border);
}
.m-card-field-label{
  font-size:10px;font-weight:800;color:var(--text3);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;
}
.m-card-field-value{
  font-size:14px;font-weight:800;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1.2;
  word-break:break-word;
}
.m-card-foot{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:13px;padding-top:12px;border-top:1px solid var(--border);
  gap:8px;
}

/* ═══════════════════════════════════════════
   MODAL & BOTTOM SHEET
═══════════════════════════════════════════ */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .2s cubic-bezier(.16,1,.3,1);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
@media(min-width:640px){
  .overlay{align-items:center;padding:24px}
}
.modal{
  background:var(--surface);width:100%;max-width:520px;
  border-radius:24px 24px 0 0;
  max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  animation:sheetUp .28s cubic-bezier(.16,1,.3,1);
  box-shadow:var(--shadow-xl);
  position:relative;
  border-top:1px solid var(--border);
}
.modal::before{
  content:'';position:sticky;top:8px;display:block;
  width:40px;height:4.5px;border-radius:99px;
  background:var(--border2);margin:0 auto 4px;opacity:.9;
  z-index:2;
}
@media(min-width:640px){
  .modal::before{display:none}
  .modal{border-radius:var(--r-xl);animation:scaleIn .22s cubic-bezier(.16,1,.3,1);border:1px solid var(--border)}
}
.modal-header{
  padding:18px 22px 16px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
  background:var(--surface);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  z-index:10;
}
.modal-title{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.02em}
.modal-body{padding:22px}
.modal-footer{
  padding:14px 22px calc(14px + var(--safe-bottom));
  border-top:1px solid var(--border);
  display:flex;gap:10px;justify-content:flex-end;
  position:sticky;bottom:0;
  background:var(--surface);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  z-index:10;
}
.close-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text3);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.close-btn:hover{background:var(--surface3);color:var(--text);border-color:var(--border2)}
.close-btn:active{transform:scale(.9)}

/* ═══════════════════════════════════════════
   FORM FIELDS
═══════════════════════════════════════════ */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field-label{
  display:block;font-size:11.5px;font-weight:800;
  color:var(--text2);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.06em;
}
.field-input{
  width:100%;min-height:44px;padding:11px 14px;
  border:1.5px solid var(--border);border-radius:12px;
  background:var(--surface);color:var(--text);font-size:14px;
  outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
  -webkit-tap-highlight-color:transparent;
}
.field-input::placeholder{color:var(--text3)}
.field-input:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-glow),0 0 0 1px var(--brand);
}
.field-input:disabled{background:var(--surface3);color:var(--text3);cursor:not-allowed;opacity:.7}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-hint{font-size:11.5px;color:var(--text3);margin-top:5px;font-weight:500}
.field-error{font-size:11.5px;color:var(--red-500);margin-top:5px;display:flex;align-items:center;gap:4px;font-weight:600}

.calc-box{
  background:var(--surface2);
  border:1.5px solid rgba(22,163,74,.3);border-radius:var(--r);
  padding:14px 16px;margin-bottom:16px;
  display:flex;flex-wrap:wrap;gap:16px;
  box-shadow:0 1px 3px rgba(22,163,74,.05);
}
[data-theme="dark"] .calc-box{
  background:rgba(34,197,94,.08);
  border-color:rgba(34,197,94,.25);
}
.calc-item{font-size:12.5px;color:var(--text2);display:flex;flex-direction:column;gap:2px}
.calc-item strong{color:var(--text);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.calc-item.profit strong{color:var(--brand)}
.calc-item.loss strong{color:var(--red-500)}

/* ═══════════════════════════════════════════
   PROGRESS BAR
═══════════════════════════════════════════ */
.progress{background:var(--border);border-radius:99px;overflow:hidden;height:6px}
.progress-bar{height:100%;border-radius:99px;transition:width .4s cubic-bezier(.16,1,.3,1)}

/* ═══════════════════════════════════════════
   CHART
═══════════════════════════════════════════ */
.chart-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:22px;
  box-shadow:var(--shadow-xs);margin-bottom:24px;
}
.chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.chart-title{font-size:14.5px;font-weight:800;color:var(--text);letter-spacing:-.01em}
.chart-sub{font-size:12px;color:var(--text3);margin-top:2px;font-weight:500}
.chart-legend{display:flex;gap:12px;align-items:center}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.legend-label{font-size:11.5px;color:var(--text3);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-bottom:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.bar-val{font-size:9.5px;color:var(--text3);font-weight:700;text-align:center;min-height:12px;font-variant-numeric:tabular-nums}
.bar-body{width:100%;border-radius:6px 6px 0 0;transition:height .5s cubic-bezier(.16,1,.3,1);cursor:pointer}
.bar-body:hover{filter:brightness(1.12)}
.bar-label{font-size:10.5px;color:var(--text3);font-weight:700;text-align:center}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
.toast-stack{
  position:fixed;top:calc(16px + var(--safe-top));right:16px;z-index:999;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:340px;width:calc(100% - 32px);
}
.toast{
  background:var(--slate-900);color:#ffffff;
  padding:12px 16px;border-radius:14px;
  font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-xl);
  display:flex;align-items:center;gap:10px;
  pointer-events:all;animation:fadeUp .24s cubic-bezier(.16,1,.3,1);
  border-left:4px solid transparent;
}
.toast.success{background:#052e16;color:#dcfce7;border-color:var(--green-500)}
.toast.error{background:#450a0a;color:#fee2e2;border-color:var(--red-500)}
.toast.info{background:#082f49;color:#e0f2fe;border-color:var(--blue-500)}
.toast.warning{background:#451a03;color:#fef3c7;border-color:var(--amber-500)}
[data-theme="dark"] .toast.success{background:#092212;color:#bbf7d0;border-color:#4ade80}
[data-theme="dark"] .toast.error{background:#2a0b0b;color:#fca5a5;border-color:#f87171}

/* ═══════════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════════ */
.empty{text-align:center;padding:56px 20px}
.empty-emoji{font-size:46px;margin-bottom:14px;opacity:.65;line-height:1}
.empty-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--text3);max-width:280px;margin:0 auto;line-height:1.5}

/* ═══════════════════════════════════════════
   RECEIPT
═══════════════════════════════════════════ */
.receipt{
  background:#fff;color:#111;
  font-family:'Courier New',Courier,monospace;
  padding:24px;border-radius:var(--r);
  font-size:13px;line-height:1.9;
  max-width:320px;margin:0 auto;
  border:1px solid #d1d5db;
  box-shadow:var(--shadow-sm);
}
.receipt-header{text-align:center;margin-bottom:12px;padding-bottom:12px;border-bottom:2px dashed #9ca3af}
.receipt-shop{font-size:17px;font-weight:900;letter-spacing:.05em}
.receipt-row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.receipt-divider{border:none;border-top:1px dashed #9ca3af;margin:10px 0}
.receipt-total{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.receipt-footer{text-align:center;margin-top:12px;padding-top:12px;border-top:2px dashed #9ca3af;font-size:11px}

/* ═══════════════════════════════════════════
   LOGIN
═══════════════════════════════════════════ */
.login-bg{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,#04190c 0%,#092e16 35%,#0f4823 70%,#15803d 100%);
  position:relative;overflow:hidden;
}
.login-bg::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 80%,rgba(34,197,94,.18) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(134,239,172,.1) 0%,transparent 50%);
}
.login-card{

    window.addEventListener("keydown",esc);
    return()=>{document.body.style.overflow=prev;window.removeEventListener("keydown",esc)};
  },[]);
  return h("div",{className:"overlay",onClick:e=>{if(e.target===e.currentTarget)onClose()}},
    h("div",{className:"modal",style:wide?{maxWidth:600}:{}},
      h("div",{className:"modal-header"},

    {icon:"📦",theme:"cat-theme-food"},
    {icon:"💎",theme:"cat-theme-beauty"},
    {icon:"🌿",theme:"cat-theme-salary"}
  ];
  let hVal=0;
  for(let i=0;i<key.length;i++)hVal=(hVal<<5)-hVal+key.charCodeAt(i);
  const picked=fallbackThemes[Math.abs(hVal)%fallbackThemes.length];
  return{icon:picked.icon,theme:picked.theme,label:raw};
}

// LOGIN
// ══════════════════════════════════════════
function Login({onLogin}){
  const [mode,setMode]=useState("in"); // "in" = ingia, "up" = jisajili
  const [email,setEmail]=useState("");
  const [pwd,setPwd]=useState("");
  const [jina,setJina]=useState("");
  const [showPwd,setShowPwd]=useState(false);
  const [err,setErr]=useState("");
  const [info,setInfo]=useState("");
  const [loading,setLoading]=useState(false);

  function quickLogin(role){
    if(role==="admin"){
      const u={id:"local-admin",email:"admin@duka.local",role:"admin",jina:"Meneja"};
      LS.set("duka_local_user",u);
      if(onLogin)onLogin(u);
    }else{
      const u={id:"local-karani",email:"karani@duka.local",role:"karani",jina:"Karani"};
      LS.set("duka_local_user",u);
      if(onLogin)onLogin(u);
    }
  }

  async function attempt(){
    if(!email.trim()||!pwd){setErr("Jaza sehemu zote ili uendelee");return}
    if(mode==="up"&&!jina.trim()){setErr("Weka jina lako kamili");return}
    if(pwd.length<6){setErr("Nywila iwe na herufi/namba angalau 6");return}
    setLoading(true);setErr("");setInfo("");
    if(mode==="in"){
      const clean=email.trim().toLowerCase();
      if((clean==="admin"||clean==="admin@duka.local"||clean==="admin@duka.com")&&pwd==="admin123"){
        quickLogin("admin");
        return;
      }
      if((clean==="karani"||clean==="karani@duka.local"||clean==="karani@duka.com")&&pwd==="karani123"){
        quickLogin("karani");
        return;
      }
      try{
        const{error}=await sbClient.auth.signInWithPassword({email:email.trim(),password:pwd});
        setLoading(false);
        if(error)setErr("Barua pepe au nywila si sahihi.");
      }catch(e){
        setLoading(false);
        setErr("Hitilafu ya mtandao au mfumo wa kuingia.");
      }
    }else{
      try{
        const{error}=await sbClient.auth.signUp({email:email.trim(),password:pwd,options:{data:{jina:jina.trim()}}});
        setLoading(false);
        if(error){setErr(error.message||"Imeshindikana kujisajili.")}
        else{
          setInfo("Akaunti imeundwa ✓ Kama umeombwa kuthibitisha barua pepe, fungua inbox yako kwanza. Kisha ingia hapa chini.");
          setMode("in");setPwd("");
        }
      }catch(e){
        setLoading(false);
        setErr("Hitilafu wakati wa kujisajili.");
      }
    }
  }

  return h("div",{className:"login-bg"},
    h("div",{className:"login-card"},
      h("div",{className:"login-logo"},
        h("div",{className:"login-logo-wrap"},"🏪"),
        h("div",{className:"login-title"},"Mfumo wa Duka"),
        h("div",{className:"login-sub"},mode==="in"?"Ingia ili kuendelea kusimamia biashara yako":"Tengeneza akaunti mpya")
      ),
      err&&h("div",{className:"login-error"},"⚠ ",err),
      info&&h("div",{className:"login-error",style:{background:"rgba(34,197,94,.1)",borderColor:"rgba(34,197,94,.3)",color:"#16a34a"}},"✓ ",info),
      mode==="up"&&h(Field,{label:"Jina Kamili"},
        h(Inp,{value:jina,onChange:setJina,placeholder:"mfano: Salma Hassan",autoComplete:"name"})
      ),
      h(Field,{label:"Jina la Mtumiaji au Barua Pepe"},
        h(Inp,{value:email,onChange:setEmail,type:"text",placeholder:"admin au jina@barua.com",autoComplete:"username",onKeyDown:e=>e.key==="Enter"&&attempt()})
      ),
      h(Field,{label:"Nywila"},
        h("div",{style:{position:"relative"}},
          h("input",{className:"field-input",type:showPwd?"text":"password",value:pwd,onChange:e=>setPwd(e.target.value),placeholder:"••••••••",style:{paddingRight:44},autoComplete:mode==="in"?"current-password":"new-password",onKeyDown:e=>e.key==="Enter"&&attempt()}),
          h("button",{onClick:()=>setShowPwd(v=>!v),style:{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",border:"none",background:"none",cursor:"pointer",fontSize:18,color:"var(--text3)",lineHeight:1}},showPwd?"🙈":"👁️")
        )
      ),
      h("button",{className:"login-btn",onClick:attempt,disabled:loading},
        loading?h(Fragment,null,"⏳ Inatuma..."):(mode==="in"?"Ingia kwenye Mfumo →":"Jisajili →")
      ),
      mode==="in"&&h("div",{className:"login-demo"},
        h("div",{className:"login-demo-title"},"🔑 Akaunti za Majaribio (Bofya kuingia):"),
        h("div",{className:"login-demo-row",style:{cursor:"pointer",padding:"4px 0"},onClick:()=>quickLogin("admin")},
          "👑 Meneja: ",h("code",null,"admin")," / ",h("code",null,"admin123")
        ),
        h("div",{className:"login-demo-row",style:{cursor:"pointer",padding:"4px 0"},onClick:()=>quickLogin("karani")},
          "📋 Karani: ",h("code",null,"karani")," / ",h("code",null,"karani123")
        )
      ),
      h("div",{style:{textAlign:"center",marginTop:16,fontSize:13,color:"var(--text3)"}},
        mode==="in"?"Huna akaunti bado? ":"Tayari una akaunti? ",
        h("a",{href:"#",onClick:e=>{e.preventDefault();setMode(m=>m==="in"?"up":"in");setErr("");setInfo("")},style:{color:"var(--brand)",fontWeight:700,textDecoration:"underline"}},mode==="in"?"Jisajili":"Ingia")
      )
    )
  );
}

function Dashboard({data,stoki}){
  const mauzo=data.mauzo||[];

  const mauzoJumla=data.mauzoJumla||[];
  const matumizi=data.matumizi||[];
  const kudai=data.madeniKudai||[];
  const kulipa=data.madeniKulipa||[];
  const asilimia=data.asilimiaFaida||20;

  const tarehe_leo=today();
  const s={
    mauzoJumla:mauzo.reduce((a,r)=>a+(+r.jumla||0),0)+mauzoJumla.reduce((a,r)=>a+(+r.kiasi||0),0),
    faidaJumla:mauzo.reduce((a,r)=>a+(+r.faida||0),0),
    mauzoCount:mauzo.length,
    manunuziJumla:manunuzi.reduce((a,r)=>a+(+r.jumla||0),0),
    faidaTarajiwa:manunuzi.reduce((a,r)=>a+(+r.faida_tarajiwa||0),0),
    usafiriJumla:manunuzi.reduce((a,r)=>a+(+r.usafiri||0),0),
    hasaraJumla:manunuzi.reduce((a,r)=>a+(+r.hasara||0),0),
    matumiziJumla:matumizi.reduce((a,r)=>a+(+r.kiasi||0),0),
    kudaiDue:kudai.filter(r=>r.status!=="Amelipa").reduce((a,r)=>a+(+r.kiasi||0),0),
    kulipaKudai:kulipa.filter(r=>r.status!=="Tumelipa").reduce((a,r)=>a+(+r.kiasi||0),0),
    stokiThamani:(stoki||[]).reduce((a,r)=>a+(+r.idadi||0)*(+r.bei_nun||0),0),
    stokiChini:(stoki||[]).filter(r=>r.idadi>0&&r.idadi<=r.min).length,
    stokiKwisha:(stoki||[]).filter(r=>r.idadi===0).length,
    manunuziLeo:manunuzi.filter(r=>r.tarehe===tarehe_leo).reduce((a,r)=>a+(+r.jumla||0),0),
    mauzoJumlaLeo:mauzoJumla.filter(r=>r.tarehe===tarehe_leo).reduce((a,r)=>a+(+r.kiasi||0),0),
    matumiziLeo:matumizi.filter(r=>r.tarehe===tarehe_leo).reduce((a,r)=>a+(+r.kiasi||0),0),
  };
  s.tathminiLeo=s.mauzoJumlaLeo-s.manunuziLeo;
  s.faidaKadiriwaLeo=s.mauzoJumlaLeo*asilimia/100;
  s.faidaHalisiKadiriwaLeo=s.faidaKadiriwaLeo-s.matumiziLeo;

  // 7-day chart
  const chartData=useMemo(()=>
    Array.from({length:7},(_,i)=>{
      const d=new Date();d.setDate(d.getDate()-(6-i));
      const k=d.toISOString().split("T")[0];
      const label=d.toLocaleDateString("sw-TZ",{weekday:"short"});
      return{
        label,
        mauzo:mauzo.filter(m=>m.tarehe===k).reduce((a,r)=>a+(+r.jumla||0),0),
        faida:mauzo.filter(m=>m.tarehe===k).reduce((a,r)=>a+(+r.faida||0),0),
      };
    })
  ,[mauzo]);

  const chartMax=Math.max(...chartData.map(d=>d.mauzo),1);

  const CARDS=[
    {icon:"📊",label:"Muhtasari wa Biashara",value:fmt(s.mauzoJumla-s.matumiziJumla),sub:"Faida baada ya matumizi yote",cardClass:"card-brown",key:"muhtasari"},
    {icon:"🛒",label:"Jumla Mauzo",value:fmt(s.mauzoJumla),sub:`Biashara ${s.mauzoCount}`,cardClass:"card-green",key:"m"},
    {icon:"💰",label:"Faida Halisi",value:fmt(s.faidaJumla),sub:"Kutoka mauzo ya bidhaa",cardClass:"card-amber",key:"f"},
    {icon:"💡",label:"Faida Tarajiwa",value:fmt(s.faidaTarajiwa),sub:"Kutoka manunuzi ya sasa",cardClass:"card-blue",key:"ft"},
    {icon:"💸",label:"Jumla Matumizi",value:fmt(s.matumiziJumla),sub:"Gharama za kila siku",cardClass:"card-red",key:"mt"},
    {icon:"📤",label:"Madeni Kudai",value:fmt(s.kudaiDue),sub:"Wateja wanaodaiwa",cardClass:"card-indigo",key:"k"},
    {icon:"📥",label:"Madeni Kulipa",value:fmt(s.kulipaKudai),sub:"Tunaodaiwa",cardClass:"card-rose",key:"kp"},
    {icon:"📦",label:"Thamani Stoki",value:fmt(s.stokiThamani),sub:"Mtaji dukani",cardClass:"card-purple",key:"st"},
    {icon:"🚗",label:"Gharama Usafiri",value:fmt(s.usafiriJumla),sub:"Jumla usafirishaji",cardClass:"card-teal",key:"u"},
    {icon:"⚠️",label:"Hasara / Uharibifu",value:fmt(s.hasaraJumla),sub:"Jumla hasara",cardClass:"card-orange",key:"h"},
    {icon:"🔴",label:"Stoki Tatizo",value:`${s.stokiChini+s.stokiKwisha} bidhaa`,sub:`${s.stokiKwisha} imeisha, ${s.stokiChini} chini`,cardClass:"card-red",key:"sc"},
  ];

  const stokiAlert=(stoki||[]).filter(r=>r.idadi<=r.min);

  return h("div",{className:"anim-up"},
    h("div",{className:"stats-grid"},
      ...CARDS.map(c=>h("div",{key:c.key,className:`stat-card ${c.cardClass||""}`},
        h("div",{className:"stat-card-icon"},c.icon),
        h("div",{className:"stat-card-label"},c.label),
        h("div",{className:"stat-card-value"},c.value),
        h("div",{className:"stat-card-sub"},c.sub)
      ))
    ),

    // Tathmini ya Leo: Mauzo Jumla, Faida Kadiriwa, Matumizi
    (s.manunuziLeo>0||s.mauzoJumlaLeo>0||s.matumiziLeo>0)&&h("div",{className:"table-card card-brown",style:{padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}},
      h("div",{className:"stat-card-icon",style:{margin:0,flexShrink:0}},s.faidaHalisiKadiriwaLeo>=0?"📋":"⚠️"),
      h("div",{style:{flex:1,minWidth:180}},
        h("div",{style:{fontWeight:800,fontSize:14,color:"#78350f"}},`📋 Muhtasari wa Tathmini ya Leo (Faida ${asilimia}% - Matumizi)`),
        h("div",{style:{fontSize:12,color:"#92400e",marginTop:2}},"Mauzo: ",h("b",null,fmt(s.mauzoJumlaLeo))," · Faida Kadiriwa: ",h("b",null,fmt(s.faidaKadiriwaLeo))," · Matumizi: ",h("b",null,fmt(s.matumiziLeo)))
      ),
      h("div",{style:{fontSize:20,fontWeight:800,color:s.faidaHalisiKadiriwaLeo>=0?"#78350f":"#dc2626"}},fmt(s.faidaHalisiKadiriwaLeo))
    ),

    // Chart
    h("div",{className:"chart-card"},
      h("div",{className:"chart-header"},
        h("div",null,
          h("div",{className:"chart-title"},"📈 Mwenendo wa Mauzo"),
          h("div",{className:"chart-sub"},"Siku 7 zilizopita")
        ),
        h("div",{className:"chart-legend"},
          h("div",{className:"legend-dot",style:{background:"var(--brand)"}}),
          h("div",{className:"legend-label"},"Mauzo"),
          h("div",{className:"legend-dot",style:{background:"#f59e0b",marginLeft:8}}),
          h("div",{className:"legend-label"},"Faida")
        )
      ),
      chartData.every(d=>d.mauzo===0)
        ?h("div",{style:{height:110,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text3)",fontSize:13}},"Hakuna mauzo wiki hii. Anza kurekodi!")
        :h("div",{className:"bars"},
          ...chartData.map((d,i)=>{
            const h100=110;
            const bh=Math.max(4,Math.round(pct(d.mauzo,chartMax)/100*h100));
            const fh=d.mauzo>0?Math.max(2,Math.round(pct(d.faida,d.mauzo)/100*bh)):0;
            return h("div",{key:i,className:"bar-col"},
              h("div",{className:"bar-val",style:{fontSize:8}},d.mauzo>0?fmt(d.mauzo).replace("TZS ",""):""),
              h("div",{style:{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end",width:"100%"}},
                h("div",{className:"bar-body",title:`${d.label}\nMauzo: ${fmt(d.mauzo)}\nFaida: ${fmt(d.faida)}`,
                  style:{height:bh,background:d.mauzo>0?"var(--brand)":"var(--border)",opacity:d.mauzo>0?1:.4,position:"relative"}},
                  fh>2&&h("div",{style:{position:"absolute",bottom:0,left:0,right:0,height:fh,background:"#f59e0b",borderRadius:"5px 5px 0 0",opacity:.85}})
                )
              ),
              h("div",{className:"bar-label"},d.label)
            );
          })
        )
    ),

    // Alert table
    stokiAlert.length>0&&h("div",{className:"table-card"},
      h("div",{style:{padding:"14px 20px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:10}},
        h("div",{style:{width:28,height:28,borderRadius:8,background:stokiAlert.filter(r=>r.idadi===0).length>0?"var(--red-50)":"var(--amber-50)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}},
          stokiAlert.filter(r=>r.idadi===0).length>0?"🔴":"⚠️"
        ),
        h("div",null,
          h("div",{style:{fontSize:14,fontWeight:700,color:"var(--text)"}},`Bidhaa ${stokiAlert.length} Zinahitaji Kujazwa`),
          h("div",{style:{fontSize:11,color:"var(--text3)",marginTop:1}},"Tembelea ukurasa wa Stoki kuchukua hatua")
        )
      ),
      h("table",null,
        h("thead",null,h("tr",null,h("th",null,"Bidhaa"),h("th",null,"Kategoria"),h("th",null,"Iliyobaki"),h("th",null,"Kiwango Chini"),h("th",null,"Hali"))),
        h("tbody",null,...stokiAlert.map(r=>{
          const katMeta=r.kat?getCategoryMeta(r.kat):null;

            h("td",{className:"td-right td-muted"},fmtN(r.min)),
            h("td",null,r.idadi===0?h(Badge,{color:"red"},"Imeisha"):h(Badge,{color:"amber"},"Stoki Chini"))
          );
        }))
      )
    )
  );
}

// ══════════════════════════════════════════
// MAUZO
// ══════════════════════════════════════════
function Mauzo({data,patchData,stoki,patchStoki,user}){
  const [q,setQ]=useState("");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [receipt,setReceipt]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const [bulkOpen,setBulkOpen]=useState(false);
  const isAdmin=user.role==="admin";

  const rows=useMemo(()=>{
    const lq=q.toLowerCase();
    return(data.mauzo||[]).filter(r=>!lq||r.bidhaa?.toLowerCase().includes(lq)||r.tarehe?.includes(lq));
  },[data.mauzo,q]);

  const totals={jumla:rows.reduce((a,r)=>a+(+r.jumla||0),0),faida:rows.reduce((a,r)=>a+(+r.faida||0),0)};

  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const jumla=(+form.idadi||0)*(+form.bei_uuz||0);
  const faida=jumla-(+form.idadi||0)*(+form.bei_nun||0);

  function openAdd(){setForm({tarehe:today(),bidhaa:"",idadi:"",bei_uuz:"",bei_nun:""});setModal("add")}
  function openEdit(r){setForm({...r});setModal("edit")}
  function onBidhaaChange(v){
    const item=stoki.find(s=>s.bidhaa===v);
    sf("bidhaa",v);
    if(item){sf("bei_uuz",item.bei_uuz);sf("bei_nun",item.bei_nun)}
  }
  function save(){
    if(!form.bidhaa||!form.idadi||!form.bei_uuz)return toast("Jaza sehemu zote","error");
    if(modal==="add"){
      const item=stoki.find(s=>s.bidhaa===form.bidhaa);
      if(item&&+form.idadi>item.idadi)return toast(`Stoki haitoshi! Iliyobaki: ${item.idadi}`,"error");
      const rec={...form,id:uid(),jumla,faida,iliyoandikwa_na:user.jina};
      patchData(p=>({...p,mauzo:[...(p.mauzo||[]),rec]}));
      if(item)patchStoki(p=>p.map(s=>s.bidhaa===form.bidhaa?{...s,idadi:s.idadi-(+form.idadi)}:s));
      toast("Mauzo yameandikwa ✓");
      setModal(null);setTimeout(()=>setReceipt(rec),300);
    }else{
      patchData(p=>({...p,mauzo:(p.mauzo||[]).map(r=>r.id===form.id?{...form,jumla,faida}:r)}));
      toast("Imesasishwa ✓");setModal(null);
    }
  }
  function del(r){

// UZA KWA WINGI (bulk sell modal)
// ══════════════════════════════════════════
function BulkMauzoModal({stoki,patchData,patchStoki,user,onClose}){
  const blank=()=>({_k:uid(),bidhaa:"",idadi:""});
  const [tarehe,setTarehe]=useState(today());
  const [rows,setRows]=useState([blank(),blank(),blank()]);
  const upd=(i,k,v)=>setRows(r=>r.map((row,idx)=>idx===i?{...row,[k]:v}:row));
  const addRow=()=>setRows(r=>[...r,blank()]);
  const rmRow=i=>setRows(r=>r.filter((_,idx)=>idx!==i));

  function usedElsewhere(bidhaa,excludeIdx){
    return rows.reduce((a,r,idx)=>(idx===excludeIdx||r.bidhaa!==bidhaa)?a:a+(+r.idadi||0),0);
  }

  const enriched=rows.map((r,i)=>{
    const item=stoki.find(s=>s.bidhaa===r.bidhaa);
    const idadi=+r.idadi||0;
    const jumla=idadi*(item?item.bei_uuz:0);
    const faida=jumla-idadi*(item?item.bei_nun:0);
    const stokiIliyobaki=item?item.idadi-usedElsewhere(r.bidhaa,i):0;
    const zaidiYaStoki=!!(item&&idadi>stokiIliyobaki);
    return{...r,item,idadi,jumla,faida,stokiIliyobaki,zaidiYaStoki};
  });
  const valid=enriched.filter(r=>r.bidhaa&&r.idadi>0&&r.item&&!r.zaidiYaStoki);
  const invalid=enriched.filter(r=>r.bidhaa&&r.idadi>0&&(!r.item||r.zaidiYaStoki));
  const totals={jumla:valid.reduce((a,r)=>a+r.jumla,0),faida:valid.reduce((a,r)=>a+r.faida,0)};

  function save(){
    if(!valid.length)return toast("Jaza angalau uuzaji mmoja sahihi","error");
    if(invalid.length)return toast("Kuna mistari yenye stoki isiyotosha — sahihisha kwanza","error");
    const recs=valid.map(r=>({id:uid(),tarehe,bidhaa:r.bidhaa,idadi:r.idadi,bei_uuz:r.item.bei_uuz,bei_nun:r.item.bei_nun,jumla:r.jumla,faida:r.faida,iliyoandikwa_na:user.jina}));
    patchData(p=>({...p,mauzo:[...(p.mauzo||[]),...recs]}));
    patchStoki(prev=>{
      let list=[...prev];
      for(const r of valid){
        const idx=list.findIndex(s=>s.bidhaa===r.bidhaa);
        if(idx>=0)list[idx]={...list[idx],idadi:list[idx].idadi-r.idadi};
      }
      return list;
    });
    toast(`Mauzo ${valid.length} yameandikwa ✓`);
    onClose();
  }

  return h(Modal,{title:"Uza Bidhaa kwa Wingi",onClose,wide:true,
    footer:h(Fragment,null,
      h("button",{className:"btn btn-secondary",onClick:onClose},"Ghairi"),
      h("button",{className:"btn btn-primary",onClick:save},`Hifadhi Mauzo (${valid.length})`)
    )},
    h(Field,{label:"Tarehe ya Mauzo (kwa mistari yote)"},h(Inp,{type:"date",value:tarehe,onChange:setTarehe})),
    h("div",{style:{fontSize:12,color:"var(--text3)",margin:"10px 0"}},"Chagua bidhaa na idadi kwa kila mstari. Bei na faida zitakokotolewa moja kwa moja kutoka Stoki."),
    ...enriched.map((r,i)=>h("div",{key:r._k,className:"table-card",style:{padding:14,marginBottom:10,borderColor:r.zaidiYaStoki?"var(--red-500)":undefined}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
        h("span",{style:{fontSize:12,fontWeight:700,color:"var(--text3)"}},`Uuzaji #${i+1}`),
        rows.length>1&&h("button",{className:"btn btn-ghost btn-sm btn-icon",onClick:()=>rmRow(i)},"✕")
      ),
      h(Field,{label:"Bidhaa"},
        h(Sel,{value:r.bidhaa,onChange:v=>upd(i,"bidhaa",v)},
          h("option",{value:""},"— Chagua bidhaa —"),
          ...stoki.map(s=>h("option",{key:s.id,value:s.bidhaa,disabled:s.idadi===0},`${s.bidhaa} (Stoki: ${s.idadi})`))
        )
      ),
      h(Field,{label:"Idadi"},h(Inp,{type:"number",min:1,value:r.idadi,onChange:v=>upd(i,"idadi",v),placeholder:"0"})),
      r.zaidiYaStoki&&h("div",{className:"field-error"},"⚠ Stoki haitoshi — iliyobaki: ",r.stokiIliyobaki),
      (r.bidhaa&&r.idadi>0&&!r.zaidiYaStoki)&&h("div",{style:{fontSize:12,color:"var(--text3)"}},"Jumla: ",h("b",{style:{color:"var(--text)"}},fmt(r.jumla))," · Faida: ",h("b",{style:{color:"var(--brand)"}},fmt(r.faida)))
    )),
    h("button",{className:"btn btn-secondary",onClick:addRow,style:{width:"100%",justifyContent:"center"}},"+ Ongeza Mstari Mwingine"),
    valid.length>0&&h("div",{className:"calc-box",style:{marginTop:14}},
      h("div",{className:"calc-item"},"Jumla Mauzo: ",h("strong",null,fmt(totals.jumla))),
      h("div",{className:clsx("calc-item",totals.faida>=0?"profit":"loss")},"Jumla Faida: ",h("strong",null,fmt(totals.faida)))
    )
  );
}

// ── Manunuzi kwa Wingi — ongeza ununuzi wa bidhaa kadhaa kwa wakati
// mmoja, ikiongeza stoki na kukokotoa faida tarajiwa kwa kila moja ──
function emptyManunuziRow(){return{_k:uid(),bidhaa:"",idadi:"",bei:"",bei_uuz_tarajiwa:"",usafiri:"",hasara:""}}
function BulkManunuziModal({stoki,patchData,patchStoki,user,onClose}){
  const [tarehe,setTarehe]=useState(today());
  const [rows,setRows]=useState([emptyManunuziRow(),emptyManunuziRow(),emptyManunuziRow()]);
  const upd=(i,k,v)=>setRows(r=>r.map((row,idx)=>idx===i?{...row,[k]:v}:row));
  const addRow=()=>setRows(r=>[...r,emptyManunuziRow()]);
  const rmRow=i=>setRows(r=>r.filter((_,idx)=>idx!==i));

  function onBidhaaChange(i,v){
    upd(i,"bidhaa",v);
    const item=stoki.find(s=>s.bidhaa.toLowerCase()===v.toLowerCase());
    if(item&&!rows[i].bei_uuz_tarajiwa)upd(i,"bei_uuz_tarajiwa",item.bei_uuz||"");
  }

  const computed=rows.map(r=>{
    const idadi=+r.idadi||0,bei=+r.bei||0,beiUuz=+r.bei_uuz_tarajiwa||0;
    return{...r,jumla:idadi*bei,faidaTarajiwa:idadi*(beiUuz-bei)};
  });
  const valid=computed.filter(r=>r.bidhaa.trim()&&r.idadi&&r.bei!=="");
  const totals=valid.reduce((a,r)=>{a.jumla+=r.jumla;a.faida+=r.faidaTarajiwa;a.usafiri+=(+r.usafiri||0);a.hasara+=(+r.hasara||0);return a},{jumla:0,faida:0,usafiri:0,hasara:0});

  function save(){
    if(!valid.length)return toast("Jaza angalau ununuzi mmoja wenye bidhaa, idadi na bei","error");
    const recs=valid.map(r=>({
      id:uid(),tarehe,bidhaa:r.bidhaa.trim(),idadi:+r.idadi,bei:+r.bei,
      bei_uuz_tarajiwa:r.bei_uuz_tarajiwa||"",usafiri:r.usafiri||"",hasara:r.hasara||"",
      jumla:r.jumla,faida_tarajiwa:r.faidaTarajiwa,iliyoandikwa_na:user.jina
    }));
    patchData(p=>({...p,manunuzi:[...(p.manunuzi||[]),...recs]}));
    patchStoki(p=>{
      let next=[...p];
      for(const r of recs){
        const bUuz=+r.bei_uuz_tarajiwa||0;
        const idx=next.findIndex(s=>s.bidhaa===r.bidhaa);
        if(idx>=0)next[idx]={...next[idx],idadi:next[idx].idadi+r.idadi,bei_nun:r.bei,bei_uuz:bUuz||next[idx].bei_uuz};
        else next=[...next,{id:uid(),bidhaa:r.bidhaa,idadi:r.idadi,bei_nun:r.bei,bei_uuz:bUuz,min:10,kat:"Nyingine"}];
      }
      return next;
    });
    toast(`Manunuzi ${recs.length} yameandikwa ✓`);
    onClose();
  }

  return h(Modal,{title:"Manunuzi kwa Wingi",onClose,wide:true,
    footer:h(Fragment,null,
      h("button",{className:"btn btn-secondary",onClick:onClose},"Ghairi"),
      h("button",{className:"btn btn-primary",onClick:save},`Hifadhi Manunuzi (${valid.length})`)
    )},
    h(Field,{label:"Tarehe (kwa mistari yote)"},h(Inp,{type:"date",value:tarehe,onChange:setTarehe})),
    h("div",{style:{fontSize:12,color:"var(--text3)",marginBottom:12}},"Ongeza ununuzi wa bidhaa kadhaa kwa wakati mmoja — stoki itaongezwa kiotomatiki kwa kila bidhaa."),
    ...computed.map((r,i)=>h("div",{key:r._k,className:"table-card",style:{padding:14,marginBottom:10}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
        h("span",{style:{fontSize:12,fontWeight:700,color:"var(--text3)"}},`Ununuzi #${i+1}`),
        rows.length>1&&h("button",{className:"btn btn-ghost btn-sm btn-icon",onClick:()=>rmRow(i)},"✕")
      ),
      h(Field,{label:"Jina la Bidhaa"},
        h("input",{className:"field-input",value:r.bidhaa,onChange:e=>onBidhaaChange(i,e.target.value),placeholder:"mfano: Chrisp, Socks...",list:"bulk-manunuzi-bidhaa"})
      ),
      h(Row,null,
        h(Field,{label:"Idadi"},h(Inp,{type:"number",min:1,value:r.idadi,onChange:v=>upd(i,"idadi",v),placeholder:"0"})),
        h(Field,{label:"Bei / Kipande (TZS)"},h(Inp,{type:"number",value:r.bei,onChange:v=>upd(i,"bei",v),placeholder:"0"}))
      ),
      h(Row,null,
        h(Field,{label:"Bei Kuuzia Tarajiwa (TZS)"},h(Inp,{type:"number",value:r.bei_uuz_tarajiwa,onChange:v=>upd(i,"bei_uuz_tarajiwa",v),placeholder:"0"})),
        h(Field,{label:"Usafiri (Hiari)"},h(Inp,{type:"number",value:r.usafiri,onChange:v=>upd(i,"usafiri",v),placeholder:"0"}))
      ),
      (r.idadi&&r.bei!=="")&&h("div",{style:{fontSize:12,marginTop:4,display:"flex",gap:14}},
        h("span",null,"Jumla: ",h("b",null,fmt(r.jumla))),
        r.bei_uuz_tarajiwa&&h("span",{style:{color:r.faidaTarajiwa>=0?"var(--brand)":"var(--red-500)"}},"Faida Tarajiwa: ",h("b",null,fmt(r.faidaTarajiwa)))
      )
    )),
    h("datalist",{id:"bulk-manunuzi-bidhaa"},...stoki.map(s=>h("option",{key:s.id,value:s.bidhaa}))),
    h("button",{className:"btn btn-secondary",onClick:addRow,style:{width:"100%",justifyContent:"center"}},"+ Ongeza Mstari Mwingine"),
    valid.length>0&&h("div",{className:"calc-box",style:{marginTop:14}},
      h("div",{className:"calc-item"},"Jumla Manunuzi: ",h("strong",null,fmt(totals.jumla))),
      h("div",{className:clsx("calc-item",totals.faida>=0?"profit":"loss")},"Jumla Faida Tarajiwa: ",h("strong",null,fmt(totals.faida))),
      totals.usafiri>0&&h("div",{className:"calc-item"},"Jumla Usafiri: ",h("strong",null,fmt(totals.usafiri)))
    )
  );
}

// DENI PAGE (shared for kudai & kulipa)
// ══════════════════════════════════════════
function DeniPage({type,data,patchData,user}){
  const isDai=type==="madeniKudai";
  const PAID=isDai?"Amelipa":"Tumelipa";
  const UNPAID=isDai?"Hajalipwa":"Bado";
  const [q,setQ]=useState("");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [confirm,setConfirm]=useState(null);
  const [bulkOpen,setBulkOpen]=useState(false);
  const [payTarget,setPayTarget]=useState(null);
  const isAdmin=user.role==="admin";

  const rows=useMemo(()=>{
    const lq=q.toLowerCase();
    return(data[type]||[]).filter(r=>!lq||r.jina?.toLowerCase().includes(lq)||r.maelezo?.toLowerCase().includes(lq));
  },[data,type,q]);

  const totals={zote:rows.reduce((a,r)=>a+(+r.kiasi||0),0),deni:rows.filter(r=>r.status!==PAID).reduce((a,r)=>a+(+r.kiasi||0),0),lipa:rows.filter(r=>r.status===PAID).reduce((a,r)=>a+(+r.kiasi||0),0)};
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));

  // Muhtasari kwa jina — jumla ya deni la mtu mmoja hata likiwa limeandikwa tarehe tofauti
  const byPerson=useMemo(()=>{
    const all=data[type]||[];
    const map=new Map();
    for(const r of all){
      const key=(r.jina||"").trim().toLowerCase();
      if(!key)continue;
      if(!map.has(key))map.set(key,{jina:r.jina.trim(),jumla:0,deni:0,lipa:0,idadi:0,rekodiZaMwisho:r.tarehe,simu:r.simu||""});
      const g=map.get(key);
      g.jumla+=(+r.kiasi||0);
      if(r.status===PAID)g.lipa+=(+r.kiasi||0);else g.deni+=(+r.kiasi||0);
      g.idadi++;
      if(r.simu)g.simu=r.simu;
      if(r.tarehe>g.rekodiZaMwisho)g.rekodiZaMwisho=r.tarehe;
    }
    return[...map.values()].sort((a,b)=>b.deni-a.deni||b.jumla-a.jumla);
  },[data,type,PAID]);
  const watuWenyeDeniZaidiYaMoja=byPerson.filter(p=>p.idadi>1).length;

  function openAdd(){setForm({tarehe:today(),jina:"",kiasi:"",maelezo:"",simu:"",status:UNPAID});setModal("add")}
  function openEdit(r){setForm({...r});setModal("edit")}
  function toggle(r){
    const becomingPaid=r.status!==PAID;

function BulkDeniModal({type,user,patchData,onClose}){
  const isDai=type==="madeniKudai";
  const UNPAID=isDai?"Hajalipwa":"Bado";
  const personLabel=isDai?"Mteja":"Muuzaji";
  const blank=()=>({_k:uid(),jina:"",kiasi:"",maelezo:"",simu:""});
  const [tarehe,setTarehe]=useState(today());
  const [rows,setRows]=useState([blank(),blank(),blank()]);
  const upd=(i,k,v)=>setRows(r=>r.map((row,idx)=>idx===i?{...row,[k]:v}:row));
  const addRow=()=>setRows(r=>[...r,blank()]);
  const rmRow=i=>setRows(r=>r.filter((_,idx)=>idx!==i));

  const valid=rows.filter(r=>r.jina.trim()&&r.kiasi);
  const total=valid.reduce((a,r)=>a+(+r.kiasi||0),0);

  function save(){
    if(!valid.length)return toast(`Jaza angalau deni moja lenye jina la ${personLabel.toLowerCase()} na kiasi`,"error");

    patchData(p=>({...p,[type]:[...(p[type]||[]),...recs]}));
    toast(`Madeni ${valid.length} yameongezwa ✓`);
    if(isDai){
      const wenyeSimu=recs.filter(r=>r.simu);
      if(wenyeSimu.length===1){
        sendSMS(wenyeSimu[0].simu,`Habari ${wenyeSimu[0].jina}, umepokea mkopo wa ${fmt(wenyeSimu[0].kiasi)} kutoka kwetu. Tafadhali lipa kwa wakati unaofaa. Asante.`);
      }else if(wenyeSimu.length>1){
        toast(`Bidhaa ${wenyeSimu.length} zina namba za simu — tumia 🔔 Kumbusho Madeni kuwatumia SMS mmoja mmoja`,"info");
      }
    }
    onClose();
  }

  return h(Modal,{title:`Ongeza Madeni kwa Wingi (${personLabel})`,onClose,wide:true,
    footer:h(Fragment,null,
      h("button",{className:"btn btn-secondary",onClick:onClose},"Ghairi"),

    )},

        h("span",{style:{fontSize:12,fontWeight:700,color:"var(--text3)"}},`Deni #${i+1}`),
        rows.length>1&&h("button",{className:"btn btn-ghost btn-sm btn-icon",onClick:()=>rmRow(i)},"✕")
      ),
      h(Field,{label:`Jina la ${personLabel}`},h(Inp,{value:r.jina,onChange:v=>upd(i,"jina",v),placeholder:"Jina kamili..."})),
      h(Row,null,
        h(Field,{label:"Kiasi (TZS)"},h(Inp,{type:"number",value:r.kiasi,onChange:v=>upd(i,"kiasi",v),placeholder:"0"})),
        h(Field,{label:"Namba ya Simu (Hiari)"},h(Inp,{type:"tel",value:r.simu,onChange:v=>upd(i,"simu",v),placeholder:"0712345678"}))

// ── Lipa/Punguza Deni la Mtu (linaweza kugusa rekodi zaidi ya moja) ──
function PayPersonModal({type,person,data,patchData,user,onClose}){
  const isDai=type==="madeniKudai";
  const PAID=isDai?"Amelipa":"Tumelipa";
  const [kiasi,setKiasi]=useState(String(person.deni));
  const [simu,setSimu]=useState(person.simu||"");

  function save(){
    let amount=+kiasi||0;
    if(amount<=0)return toast("Weka kiasi sahihi","error");
    if(amount>person.deni){
      amount=person.deni;
      toast(`Kiasi kimepunguzwa kufikia deni lililopo: ${fmt(person.deni)}`,"warning");
    }
    const key=person.jina.trim().toLowerCase();
    const all=[...(data[type]||[])];
    const unpaid=all
      .map((r,i)=>({r,i}))
      .filter(({r})=>r.status!==PAID&&(r.jina||"").trim().toLowerCase()===key)
      .sort((a,b)=>(a.r.tarehe||"").localeCompare(b.r.tarehe||""));
    let remaining=amount;
    const additions=[];
    for(const{r,i}of unpaid){
      if(remaining<=0)break;
      const kiasiR=+r.kiasi||0;
      if(kiasiR<=remaining){
        all[i]={...r,status:PAID,simu:simu.trim()||r.simu};
        remaining-=kiasiR;
      }else{
        all[i]={...r,kiasi:kiasiR-remaining,simu:simu.trim()||r.simu};
        additions.push({
          id:uid(),tarehe:r.tarehe,jina:r.jina,kiasi:remaining,
          maelezo:(r.maelezo?r.maelezo+" · ":"")+"Malipo sehemu",
          status:PAID,simu:simu.trim()||r.simu,iliyoandikwa_na:user.jina
        });
        remaining=0;
      }
    }
    patchData(p=>({...p,[type]:[...all,...additions]}));
    toast(`Malipo ya ${fmt(amount)} yamerekodiwa kwa ${person.jina} ✓`);
    if(isDai&&simu.trim()){
      const salio=person.deni-amount;
      const ujumbe=salio<=0
        ?`Habari ${person.jina}, asante kwa kulipa deni lako la ${fmt(amount)}. Sasa huna deni tena kwetu. Asante kwa kuendelea kuwa mteja wetu.`
        :`Habari ${person.jina}, tumepokea malipo ya ${fmt(amount)}. Deni lililobaki ni ${fmt(salio)}. Asante.`;
      sendSMS(simu.trim(),ujumbe);
    }
    onClose();
  }

  return h(Modal,{title:`Lipa/Punguza Deni — ${person.jina}`,onClose,
    footer:h(Fragment,null,
      h("button",{className:"btn btn-secondary",onClick:onClose},"Ghairi"),
      h("button",{className:"btn btn-primary",onClick:save},"Hifadhi Malipo")
    )},
    h("div",{style:{fontSize:13,color:"var(--text3)",marginBottom:14,lineHeight:1.6}},
      `${person.jina} anadaiwa `,h("b",{style:{color:"var(--red-500)"}},fmt(person.deni)),
      ` kutoka rekodi ${person.idadi}. Weka kiasi alicholipa — mfumo utapunguza kuanzia deni la zamani zaidi kwenda jipya, na kugawanya rekodi kama malipo hayakidhi deni zima.`
    ),
    h(Field,{label:"Kiasi Alicholipa (TZS)"},h(Inp,{type:"number",value:kiasi,onChange:setKiasi,placeholder:"0"})),
    h("button",{className:"btn btn-secondary btn-sm",style:{marginTop:8,marginBottom:4},onClick:()=>setKiasi(String(person.deni))},"Amelipa Deni Lote"),
    isDai&&h(Field,{label:"Namba ya Simu (Hiari — kwa SMS ya uthibitisho)",hint:"Ukijaza, tutamtumia SMS na kuihifadhi kwa matumizi ya baadaye"},
      h(Inp,{type:"tel",value:simu,onChange:setSimu,placeholder:"0712345678"})
    )
  );
}

function Matumizi({data,patchData,user}){

// ONGEZA BIDHAA KWA WINGI (bulk stock modal)
// ══════════════════════════════════════════
function BulkStokiModal({stoki,patchStoki,onClose}){
  const blank=()=>({_k:uid(),bidhaa:"",kat:"",idadi:"",bei_nun:"",bei_uuz:"",min:"10"});
  const [rows,setRows]=useState([blank(),blank(),blank()]);
  const upd=(i,k,v)=>setRows(r=>r.map((row,idx)=>idx===i?{...row,[k]:v}:row));
  const addRow=()=>setRows(r=>[...r,blank()]);
  const rmRow=i=>setRows(r=>r.filter((_,idx)=>idx!==i));

  const valid=rows.filter(r=>r.bidhaa.trim()&&r.idadi);
  const totalMtaji=valid.reduce((a,r)=>a+(+r.idadi||0)*(+r.bei_nun||0),0);

  function save(){
    if(!valid.length)return toast("Jaza angalau bidhaa moja yenye jina na idadi","error");
    patchStoki(prev=>{
      let list=[...prev];
      for(const r of valid){
        const idx=list.findIndex(s=>s.bidhaa.toLowerCase()===r.bidhaa.trim().toLowerCase());
        const bNun=+r.bei_nun||0,bUuz=+r.bei_uuz||0,idadiOngeza=+r.idadi||0,min=+r.min||10;
        if(idx>=0){
          list[idx]={...list[idx],idadi:list[idx].idadi+idadiOngeza,bei_nun:bNun||list[idx].bei_nun,bei_uuz:bUuz||list[idx].bei_uuz,kat:r.kat.trim()||list[idx].kat};
        }else{
          list.push({id:uid(),bidhaa:r.bidhaa.trim(),kat:r.kat.trim(),idadi:idadiOngeza,bei_nun:bNun,bei_uuz:bUuz,min});
        }
      }
      return list;
    });
    toast(`Bidhaa ${valid.length} zimeongezwa ✓`);
    onClose();
  }

  return h(Modal,{title:"Ongeza Bidhaa kwa Wingi",onClose,wide:true,
    footer:h(Fragment,null,
      h("button",{className:"btn btn-secondary",onClick:onClose},"Ghairi"),

// ── Hesabu ya Stoki (Stock Take) — sasisha idadi ya bidhaa zote kwa
// wakati mmoja baada ya kuhesabu kwa mkono kilichobaki dukani ──
function StockTakeModal({stoki,patchStoki,onClose}){
  const [q,setQ]=useState("");
  const [counts,setCounts]=useState(()=>Object.fromEntries((stoki||[]).map(s=>[s.id,String(s.idadi)])));
  function setCount(id,v){setCounts(c=>({...c,[id]:v}))}

  const rows=useMemo(()=>{
    const lq=q.toLowerCase();
    return(stoki||[]).filter(s=>!lq||s.bidhaa?.toLowerCase().includes(lq));
  },[stoki,q]);

  const diffOf=s=>{
    const raw=counts[s.id];
    if(raw===""||raw==null||raw===undefined)return null;
    return(+raw)-s.idadi;
  };
  const changed=(stoki||[]).filter(s=>{const d=diffOf(s);return d!==null&&d!==0});
  const totalDiffValue=changed.reduce((a,s)=>a+diffOf(s)*(+s.bei_nun||0),0);

  function save(){
    if(!changed.length)return toast("Hakuna mabadiliko ya kuhifadhi","info");
    patchStoki(p=>p.map(s=>{
      const raw=counts[s.id];
      if(raw===""||raw==null)return s;
      const n=+raw;
      if(Number.isNaN(n)||n<0)return s;
      return{...s,idadi:n};
    }));
    toast(`Stoki ya bidhaa ${changed.length} imesasishwa ✓`);
    onClose();
  }

  return h(Modal,{title:"📋 Hesabu ya Stoki (Stock Take)",onClose,wide:true,
    footer:h(Fragment,null,
      h("button",{className:"btn btn-secondary",onClick:onClose},"Ghairi"),
      h("button",{className:"btn btn-primary",onClick:save},`Sasisha Stoki (${changed.length})`)
    )},
    h("div",{style:{fontSize:12,color:"var(--text3)",marginBottom:12,lineHeight:1.6}},
      "Hesabu kwa mkono kilichobaki dukani cha kila bidhaa, weka idadi halisi hapa chini, kisha bonyeza 'Sasisha Stoki'. Mfumo utaonyesha tofauti (kilichouzwa/kimepotea) na kubadilisha idadi ya bidhaa zote kwa wakati mmoja."
    ),
    h(Search,{value:q,onChange:setQ,placeholder:"Tafuta bidhaa..."}),
    h("div",{style:{display:"flex",flexDirection:"column",gap:8,marginTop:12,maxHeight:420,overflowY:"auto"}},
      !rows.length&&h(Empty,{emoji:"📦",title:"Hakuna bidhaa"}),
      ...rows.map(s=>{
        const raw=counts[s.id];
        const d=diffOf(s);
        return h("div",{key:s.id,style:{display:"flex",alignItems:"center",gap:10,border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"10px 12px",background:"var(--surface2)"}},
          h("div",{style:{flex:1,minWidth:0}},
            h("div",{style:{display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},
              h("span",{style:{fontWeight:700,fontSize:13.5}},s.bidhaa),
              s.kat&&h(CategoryBadge,{kat:s.kat})
            ),
            h("div",{style:{fontSize:11,color:"var(--text3)",marginTop:2}},`Kwenye mfumo: ${fmtN(s.idadi)}`)
          ),
          h("input",{className:"field-input",type:"number",min:0,style:{width:88,textAlign:"center",flexShrink:0},value:raw===undefined?"":raw,onChange:e=>setCount(s.id,e.target.value),placeholder:"0"}),
          h("div",{style:{width:70,textAlign:"right",flexShrink:0}},
            d!==null&&d!==0&&h("span",{style:{fontSize:12,fontWeight:700,color:d>0?"var(--brand)":"var(--red-500)"}},d>0?`+${fmtN(d)}`:fmtN(d))
          )
        );
      })
    ),
    changed.length>0&&h("div",{className:"calc-box",style:{marginTop:14}},
      h("div",{className:"calc-item"},"Bidhaa zenye mabadiliko: ",h("strong",null,changed.length)),
      h("div",{className:clsx("calc-item",totalDiffValue>=0?"profit":"loss")},"Thamani ya tofauti (bei ya kununulia): ",h("strong",null,fmt(totalDiffValue)))
    )
  );
}

function Profile({user,data,stoki,patchData,patchStoki}){
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({mpya:"",thibiti:""});
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const isAdmin=user.role==="admin";
  const fileRef=useRef(null);

  async function changePwd(){
    if(!form.mpya)return toast("Weka nywila mpya","error");
    if(form.mpya.length<6)return toast("Nywila iwe na herufi/namba angalau 6","error");
    if(form.mpya!==form.thibiti)return toast("Nywila hazifanani","error");
    const{error}=await sbClient.auth.updateUser({password:form.mpya});
    if(error)return toast("Imeshindwa kubadilisha nywila: "+error.message,"error");
    toast("Nywila imebadilishwa ✓");setModal(false);setForm({mpya:"",thibiti:""});
  }

  function downloadBackup(){
    const backup={
      _mfumo:"Mfumo wa Duka",_toleo:2,_tarehe:new Date().toISOString(),
      data,stoki
    };
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`duka-nakala-${today()}.json`;
    a.click();
    toast("Nakala ya data imepakuliwa ✓");
  }

  function applyRestore(text){
    let parsed;
    try{parsed=JSON.parse(text)}
    catch(e){return toast("Faili si sahihi (siyo JSON halali)","error")}
    if(!parsed||!parsed.data||!parsed.stoki)return toast("Faili hii si nakala sahihi ya Mfumo wa Duka","error");
    patchData(()=>parsed.data);
    patchStoki(()=>parsed.stoki);
    toast("Data imerejeshwa kikamilifu ✓ (Imetumwa kwa watumiaji wote)");
  }

  function onFilePicked(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>applyRestore(ev.target.result);
    reader.readAsText(file);
    e.target.value="";
  }

  return h("div",{className:"anim-up"},
    h("div",{className:"section-top"},h("div",{className:"section-title-block"},h("h2",null,"⚙️ Akaunti Yangu"))),
    h("div",{className:"profile-card"},
      h("div",{className:"profile-avatar-wrap"},
        h("div",{className:"profile-avatar",style:{background:isAdmin?"var(--purple-600)":"var(--blue-600)"}},user.jina[0].toUpperCase()),
        h("div",null,
          h("div",{className:"profile-name"},user.jina),
          h(Badge,{color:isAdmin?"purple":"blue"},isAdmin?"👑 Meneja":"📋 Karani"),
          h("div",{className:"profile-meta"},"ID: ",h("code",{style:{fontFamily:"monospace",fontSize:13,background:"var(--surface3)",padding:"1px 6px",borderRadius:4}},user.id))
        )
      ),
      h("div",{className:"divider"}),
      h("button",{className:"btn btn-secondary",onClick:()=>setModal(true)},"🔑 Badilisha Nywila Yangu")
    ),
    h("div",{className:"profile-card",style:{marginTop:16}},
      h("div",{style:{fontWeight:800,fontSize:15,marginBottom:4}},"💾 Hifadhi na Rejesha Data"),
      h("div",{style:{fontSize:12.5,color:"var(--text3)",marginBottom:14,lineHeight:1.5}},
        "Data yako ipo kwenye kifaa hiki tu. Ikiwa utafuta cache/history ya kivinjari, data itapotea. Pakua nakala mara kwa mara ili uweze kuirejesha wakati wowote — hata kwenye kifaa kingine."
      ),
      h("div",{style:{display:"flex",gap:10,flexWrap:"wrap"}},
        h("button",{className:"btn btn-primary",onClick:downloadBackup},"⬇️ Pakua Nakala ya Data"),
        h("button",{className:"btn btn-secondary",onClick:()=>fileRef.current.click()},"⬆️ Rejesha kutoka Faili"),
        h("input",{ref:fileRef,type:"file",accept:"application/json",style:{display:"none"},onChange:onFilePicked})
      )
    ),
    modal&&h(Modal,{title:"Badilisha Nywila",onClose:()=>setModal(false),
      footer:h(Fragment,null,h("button",{className:"btn btn-secondary",onClick:()=>setModal(false)},"Ghairi"),h("button",{className:"btn btn-primary",onClick:changePwd},"Badilisha"))},
      h(Field,{label:"Nywila Mpya"},h("input",{className:"field-input",type:"password",value:form.mpya,onChange:e=>sf("mpya",e.target.value),placeholder:"••••••••"})),
      h(Field,{label:"Thibitisha"},h("input",{className:"field-input",type:"password",value:form.thibiti,onChange:e=>sf("thibiti",e.target.value),placeholder:"••••••••"}))
    )
  );
}

// EXPORT ALL
// ══════════════════════════════════════════
function exportAll(data){
  let csv="";
  const sections={Mauzo:data.mauzo,Manunuzi:data.manunuzi,"Madeni Kudai":data.madeniKudai,"Madeni Kulipa":data.madeniKulipa};
  for(const[name,rows]of Object.entries(sections)){
    csv+=`\n\n=== ${name} ===\n`;
    if(rows?.length){csv+=Object.keys(rows[0]).join(",")+"\n";csv+=rows.map(r=>Object.values(r).map(v=>`"${v}"`).join(",")).join("\n")}
    else csv+="(Hakuna data)\n";
  }
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`duka-data-${today()}.csv`;a.click();
  toast("Data yote imepakiwa ✓");
}
